[project]
name = "polaris-mis-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
