<!doctype html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <style>
            :root {
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                padding: 0;
                font:
                    14px -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #fff;
                color: #000;
            }
            img {
                max-width: 100%;
            }
            [hidden]:not([hidden="until-found" i]) {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <title>Polaris MIS Command Center</title>
        <meta name="claude:viewport-fit-sides" content="cover" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        />
        <style>
            /* Layout concept: navy navigation rail + light analytic workspace with a sticky two-row filter header; detail opens in a right drawer. */
            :root {
                --bg: #f3f5fa;
                --surface: #ffffff;
                --surface2: #f7f9fd;
                --line: #e0e5ef;
                --line2: #cbd3e3;
                --ink: #0e1a3a;
                --ink2: #4b5875;
                --ink3: #76839f;
                --accent: #2457d6;
                --accent-bg: #e7edfc;
                --accent-ink: #1a44ae;
                --good: #168a5a;
                --good-bg: #e0f4ea;
                --warn: #b8740a;
                --warn-bg: #fcf0d8;
                --bad: #cc3b35;
                --bad-bg: #fbe4e2;
                --neu: #6b7792;
                --neu-bg: #ebeef5;
                --side: #0e1a3a;
                --side-ink: #c5cee6;
                --side-ink2: #8794b6;
                --side-act: #1e306a;
                --side-line: #1d2a52;
                --c1: #2457d6;
                --c2: #13a0a0;
                --c3: #e0932a;
                --c4: #8656c9;
                --c5: #d14c86;
                --c6: #5f7089;
                --c7: #6fa836;
                --grid: #e8ecf4;
                --shadow: 0 1px 2px rgba(14, 26, 58, 0.06), 0 4px 14px rgba(14, 26, 58, 0.05);
                --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #0a1226;
                    --surface: #121c38;
                    --surface2: #16224370;
                    --line: #223056;
                    --line2: #2e3e6b;
                    --ink: #e7ecf8;
                    --ink2: #a9b6d3;
                    --ink3: #7f8db0;
                    --accent: #6b94ff;
                    --accent-bg: #1b2a55;
                    --accent-ink: #9db7ff;
                    --good: #3dc088;
                    --good-bg: #123a2d;
                    --warn: #e5a53b;
                    --warn-bg: #3b2d10;
                    --bad: #f06a63;
                    --bad-bg: #40191a;
                    --neu: #93a0bf;
                    --neu-bg: #1c2747;
                    --side: #08102a;
                    --side-ink: #b9c4e2;
                    --side-ink2: #7482a8;
                    --side-act: #18295c;
                    --side-line: #16224a;
                    --c1: #6b94ff;
                    --c2: #3cc4c4;
                    --c3: #f0ae55;
                    --c4: #a98be6;
                    --c5: #ee7fad;
                    --c6: #93a0bf;
                    --c7: #98cc62;
                    --grid: #1c2847;
                    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --bg: #0a1226;
                --surface: #121c38;
                --surface2: #16224370;
                --line: #223056;
                --line2: #2e3e6b;
                --ink: #e7ecf8;
                --ink2: #a9b6d3;
                --ink3: #7f8db0;
                --accent: #6b94ff;
                --accent-bg: #1b2a55;
                --accent-ink: #9db7ff;
                --good: #3dc088;
                --good-bg: #123a2d;
                --warn: #e5a53b;
                --warn-bg: #3b2d10;
                --bad: #f06a63;
                --bad-bg: #40191a;
                --neu: #93a0bf;
                --neu-bg: #1c2747;
                --side: #08102a;
                --side-ink: #b9c4e2;
                --side-ink2: #7482a8;
                --side-act: #18295c;
                --side-line: #16224a;
                --c1: #6b94ff;
                --c2: #3cc4c4;
                --c3: #f0ae55;
                --c4: #a98be6;
                --c5: #ee7fad;
                --c6: #93a0bf;
                --c7: #98cc62;
                --grid: #1c2847;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                font:
                    13px/1.45 "IBM Plex Sans",
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                background: var(--bg);
                color: var(--ink);
                font-variant-numeric: tabular-nums;
                overflow: hidden;
            }
            button,
            input,
            select,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            a {
                color: var(--accent);
            }
            .mono {
                font-family: var(--mono);
                font-size: 12px;
            }
            .app {
                display: grid;
                grid-template-columns: var(--sw, 240px) minmax(0, 1fr);
                height: 100%;
                transition: grid-template-columns 0.18s;
            }
            .app.collapsed {
                --sw: 62px;
            }
            /* sidebar */
            .side {
                background: var(--side);
                color: var(--side-ink);
                display: flex;
                flex-direction: column;
                min-height: 0;
                padding-left: env(safe-area-inset-left, 0px);
                z-index: 40;
            }
            .brand {
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 14px 14px 12px;
                border-bottom: 1px solid var(--side-line);
                min-height: 58px;
            }
            .logo {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                background: linear-gradient(135deg, #2457d6, #13a0a0);
                display: grid;
                place-items: center;
                color: #fff;
                font-weight: 700;
                flex: none;
            }
            .brand b {
                display: block;
                color: #fff;
                font-size: 13px;
                line-height: 1.2;
            }
            .brand small {
                color: var(--side-ink2);
                font-size: 11px;
            }
            .collapsed .brand div,
            .collapsed .navlbl,
            .collapsed .nav-sec,
            .collapsed .sidefoot span {
                display: none;
            }
            .nav {
                flex: 1;
                overflow: auto;
                padding: 8px 8px;
            }
            .nav-sec {
                font-size: 10px;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--side-ink2);
                padding: 12px 10px 4px;
            }
            .nav button {
                display: flex;
                gap: 10px;
                align-items: center;
                width: 100%;
                border: 0;
                background: none;
                color: var(--side-ink);
                padding: 7px 10px;
                border-radius: 7px;
                text-align: left;
                font-size: 12.5px;
            }
            .nav button:hover {
                background: var(--side-line);
            }
            .nav button.on {
                background: var(--side-act);
                color: #fff;
                font-weight: 600;
            }
            .nav svg,
            .ic {
                width: 16px;
                height: 16px;
                flex: none;
                stroke: currentColor;
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .navbadge {
                margin-left: auto;
                background: var(--bad);
                color: #fff;
                border-radius: 9px;
                font-size: 10px;
                padding: 0 6px;
                line-height: 16px;
            }
            .collapsed .navbadge {
                display: none;
            }
            .sidefoot {
                border-top: 1px solid var(--side-line);
                padding: 8px;
            }
            .sidefoot button {
                display: flex;
                gap: 10px;
                align-items: center;
                width: 100%;
                background: none;
                border: 0;
                color: var(--side-ink2);
                padding: 6px 10px;
                border-radius: 7px;
            }
            .sidefoot button:hover {
                background: var(--side-line);
            }
            /* header */
            .main {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
                height: 100%;
            }
            .hdr {
                background: var(--surface);
                border-bottom: 1px solid var(--line);
                padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: none;
            }
            .hrow {
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
            }
            .hrow.top {
                justify-content: space-between;
            }
            .inst {
                font-weight: 600;
                font-size: 13px;
            }
            .inst small {
                display: block;
                font-weight: 400;
                color: var(--ink3);
                font-size: 11px;
            }
            .demo {
                background: var(--warn-bg);
                color: var(--warn);
                border: 1px solid var(--warn);
                border-radius: 6px;
                padding: 2px 8px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.03em;
            }
            .sp {
                flex: 1;
            }
            .sel,
            .inp {
                background: var(--surface);
                border: 1px solid var(--line2);
                border-radius: 7px;
                padding: 5px 8px;
                min-height: 30px;
                max-width: 100%;
            }
            .sel:focus,
            .inp:focus,
            button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }
            .flt {
                display: flex;
                gap: 4px;
                align-items: center;
                color: var(--ink3);
                font-size: 11px;
            }
            .flt label {
                white-space: nowrap;
            }
            .btn {
                background: var(--surface);
                border: 1px solid var(--line2);
                border-radius: 7px;
                padding: 5px 10px;
                min-height: 30px;
                display: inline-flex;
                gap: 6px;
                align-items: center;
                white-space: nowrap;
            }
            .btn:hover {
                background: var(--surface2);
                border-color: var(--ink3);
            }
            .btn.pri {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .btn.pri:hover {
                filter: brightness(1.08);
            }
            .btn.sm {
                padding: 2px 8px;
                min-height: 24px;
                font-size: 12px;
            }
            .btn.bad {
                color: var(--bad);
                border-color: var(--bad);
            }
            .btn.ghost {
                border-color: transparent;
                background: none;
            }
            .iconbtn {
                width: 32px;
                height: 32px;
                display: grid;
                place-items: center;
                border: 1px solid var(--line2);
                border-radius: 8px;
                background: var(--surface);
                position: relative;
            }
            .iconbtn .cnt {
                position: absolute;
                top: -5px;
                right: -5px;
                background: var(--bad);
                color: #fff;
                border-radius: 9px;
                font-size: 10px;
                line-height: 16px;
                min-width: 16px;
                text-align: center;
                padding: 0 3px;
            }
            .searchbox {
                position: relative;
                width: min(300px, 100%);
            }
            .searchbox input {
                width: 100%;
                padding-left: 30px;
            }
            .searchbox .ic {
                position: absolute;
                left: 9px;
                top: 7px;
                color: var(--ink3);
                width: 15px;
            }
            .sres {
                position: absolute;
                top: 36px;
                left: 0;
                right: 0;
                min-width: 320px;
                background: var(--surface);
                border: 1px solid var(--line2);
                border-radius: 10px;
                box-shadow: var(--shadow);
                max-height: 380px;
                overflow: auto;
                z-index: 60;
            }
            .sres button {
                display: flex;
                gap: 8px;
                width: 100%;
                border: 0;
                background: none;
                padding: 7px 10px;
                text-align: left;
                align-items: center;
            }
            .sres button:hover {
                background: var(--surface2);
            }
            .sres .grp {
                font-size: 10px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--ink3);
                padding: 8px 10px 2px;
            }
            .avatar {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: var(--accent-bg);
                color: var(--accent-ink);
                display: grid;
                place-items: center;
                font-weight: 600;
                font-size: 11px;
            }
            .stamp {
                font-size: 11px;
                color: var(--ink3);
            }
            /* content */
            .content {
                flex: 1;
                overflow: auto;
                padding: 14px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
            }
            .crumbs {
                display: flex;
                gap: 6px;
                align-items: center;
                color: var(--ink3);
                font-size: 12px;
                flex-wrap: wrap;
                margin-bottom: 6px;
            }
            .crumbs a {
                color: var(--ink2);
                text-decoration: none;
                cursor: pointer;
            }
            .crumbs a:hover {
                color: var(--accent);
            }
            .ptitle {
                display: flex;
                gap: 12px;
                align-items: flex-end;
                justify-content: space-between;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }
            .ptitle h1 {
                margin: 0;
                font-size: 20px;
                letter-spacing: -0.01em;
                text-wrap: balance;
            }
            .ptitle p {
                margin: 2px 0 0;
                color: var(--ink2);
                max-width: 80ch;
            }
            .ctxchips {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .chip {
                background: var(--accent-bg);
                color: var(--accent-ink);
                border-radius: 999px;
                padding: 2px 9px;
                font-size: 11px;
                font-weight: 500;
                display: inline-flex;
                gap: 4px;
                align-items: center;
            }
            .chip button {
                border: 0;
                background: none;
                padding: 0;
                line-height: 1;
                color: inherit;
            }
            /* grid helpers */
            .g {
                display: grid;
                gap: 12px;
            }
            .g2 {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
            }
            .g3 {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            }
            .g4 {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
            }
            .g5 {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
            }
            .gmain {
                grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            }
            @media (max-width: 1100px) {
                .gmain {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 12px 14px;
                min-width: 0;
            }
            .card.flat {
                box-shadow: none;
            }
            .card h3 {
                margin: 0 0 2px;
                font-size: 13px;
                font-weight: 600;
                display: flex;
                gap: 6px;
                align-items: center;
                justify-content: space-between;
            }
            .card .sub {
                color: var(--ink3);
                font-size: 11.5px;
                margin-bottom: 8px;
            }
            .card .hd {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                align-items: flex-start;
                flex-wrap: wrap;
                margin-bottom: 6px;
            }
            .hd h3 {
                margin: 0;
            }
            .stack {
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-width: 0;
            }
            .row {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }
            .muted {
                color: var(--ink3);
            }
            .ink2 {
                color: var(--ink2);
            }
            .b {
                font-weight: 600;
            }
            .r {
                text-align: right;
            }
            .nw {
                white-space: nowrap;
            }
            .good {
                color: var(--good);
            }
            .warn {
                color: var(--warn);
            }
            .bad {
                color: var(--bad);
            }
            .neu {
                color: var(--neu);
            }
            /* KPI */
            .kpi {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px 12px;
                text-align: left;
                display: flex;
                flex-direction: column;
                gap: 3px;
                min-width: 0;
                position: relative;
                transition:
                    border-color 0.12s,
                    box-shadow 0.12s;
            }
            button.kpi:hover {
                border-color: var(--accent);
                box-shadow: var(--shadow);
            }
            .kpi .kl {
                display: flex;
                justify-content: space-between;
                gap: 6px;
                color: var(--ink2);
                font-size: 11.5px;
            }
            .kpi .kv {
                font-size: 24px;
                font-weight: 600;
                letter-spacing: -0.02em;
                line-height: 1.1;
            }
            .kpi .kv small {
                font-size: 12px;
                font-weight: 500;
                color: var(--ink3);
                margin-left: 3px;
            }
            .kpi .km {
                display: flex;
                gap: 6px;
                align-items: center;
                flex-wrap: wrap;
                font-size: 11px;
                color: var(--ink3);
            }
            .kpi .spark {
                height: 26px;
                margin-top: 2px;
            }
            .kpi::before {
                content: "";
                position: absolute;
                left: 0;
                top: 10px;
                bottom: 10px;
                width: 3px;
                border-radius: 0 3px 3px 0;
                background: var(--st, var(--line2));
            }
            .kpi.s-good {
                --st: var(--good);
            }
            .kpi.s-warn {
                --st: var(--warn);
            }
            .kpi.s-bad {
                --st: var(--bad);
            }
            .dl {
                display: inline-flex;
                gap: 2px;
                align-items: center;
                font-weight: 600;
            }
            .dl.good {
                color: var(--good);
            }
            .dl.bad {
                color: var(--bad);
            }
            .dl.flat {
                color: var(--ink3);
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                border-radius: 999px;
                padding: 1px 8px;
                font-size: 11px;
                font-weight: 500;
                white-space: nowrap;
                background: var(--neu-bg);
                color: var(--neu);
            }
            .pill.good {
                background: var(--good-bg);
                color: var(--good);
            }
            .pill.warn {
                background: var(--warn-bg);
                color: var(--warn);
            }
            .pill.bad {
                background: var(--bad-bg);
                color: var(--bad);
            }
            .pill.acc {
                background: var(--accent-bg);
                color: var(--accent-ink);
            }
            .pill::before {
                content: "";
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: currentColor;
            }
            .pill.nodot::before {
                display: none;
            }
            .info {
                display: inline-grid;
                place-items: center;
                width: 15px;
                height: 15px;
                border-radius: 50%;
                border: 1px solid var(--line2);
                color: var(--ink3);
                font-size: 10px;
                cursor: help;
                background: none;
                padding: 0;
            }
            /* tabs */
            .tabs {
                display: flex;
                gap: 2px;
                border-bottom: 1px solid var(--line);
                margin: 0 0 12px;
                overflow: auto;
                flex: none;
            }
            .tabs button {
                border: 0;
                background: none;
                padding: 8px 12px;
                color: var(--ink2);
                border-bottom: 2px solid transparent;
                white-space: nowrap;
                font-weight: 500;
            }
            .tabs button:hover {
                color: var(--ink);
            }
            .tabs button.on {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }
            .seg {
                display: inline-flex;
                border: 1px solid var(--line2);
                border-radius: 8px;
                overflow: hidden;
            }
            .seg button {
                border: 0;
                background: var(--surface);
                padding: 4px 10px;
                color: var(--ink2);
                border-right: 1px solid var(--line2);
                min-height: 28px;
            }
            .seg button:last-child {
                border-right: 0;
            }
            .seg button.on {
                background: var(--accent);
                color: #fff;
            }
            /* tables */
            .tw {
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 10px;
                max-height: 560px;
                background: var(--surface);
            }
            .tw.nomax {
                max-height: none;
            }
            table.dt {
                border-collapse: separate;
                border-spacing: 0;
                width: 100%;
                font-size: 12.5px;
            }
            .dt th {
                position: sticky;
                top: 0;
                background: var(--surface2);
                background-color: color-mix(in srgb, var(--surface) 92%, var(--ink) 4%);
                text-align: left;
                font-weight: 600;
                color: var(--ink2);
                padding: 7px 10px;
                border-bottom: 1px solid var(--line);

            const MENTORS = [];

            BATCHES.forEach((b) => {

            /* ---------- students ---------- */
            const STUDENTS = [],
                BSTU = {};
            let serial = {};
            BATCHES.forEach((b) => {
                BSTU[b.id] = [];
                const meanA = {
                    "B23-AI": 70,

                    STUDENTS.push(s);
                }
            });
            const STU = Object.fromEntries(STUDENTS.map((s) => [s.id, s]));
            // scenario groups
            (function () {
                const g = BSTU["B24-AI"];
                for (let i = 0; i < 16; i++) g[i * 5 + 2].flags.drop = true; // declining attendance group
                const all = STUDENTS.filter((s) => !s.flags.drop);
                for (let i = 0; i < 14; i++) {
                    const s = pick(all);
                    s.baseP = clamp(s.baseP - 0.2, 0.4, 0.8);
                } // chronic low attenders
                for (let i = 0; i < 12; i++) {
                    const s = pick(all);
                    const e = LAST - ri(0, 1);
                    s.flags.absWin = [e - ri(2, 5), e];
                } // current absence streak
                for (let i = 0; i < 40; i++) {
                    const s = pick(all);
                    const a = T0 + ri(5, 55);
                    s.flags.absWin2 = [a, a + ri(2, 4)];
                }
                // withdrawn + late joiners
                const w = [
                    BSTU["B25-CB"][11],
                    BSTU["B25-CB"][47],
                    BSTU["B24-PM"][9],
                    BSTU["B26-AI"][30],
                    BSTU["B25-PM"][5],
                    BSTU["B23-AI"][3],
                ];
                w.forEach((s, i) => {
                    s.leave = toDn("2026-09-18") + i * 4;
                    s.status = "Withdrawn";
                });
                [BSTU["B26-AI"][68], BSTU["B26-AI"][69], BSTU["B25-PM"][58], BSTU["B25-PM"][59]].forEach((s, i) => {
                    s.join = T0 + 7 + i * 3;
                    s.late = true;
                });
            })();
            const activeAt = (s, d) => d >= s.join && (s.leave == null || d < s.leave);

            /* ---------- sessions (timetable + delivery) ---------- */
            const SESSIONS = [],
                busy = new Set();
            let sn = 10000;
            const LMS_OUT = T0 + 22;
            const REASONS = {
                Missed: [
                    "Mentor unavailable – illness",
                    "Mentor unavailable – travel",
                    "Slot not confirmed with mentor",
                    "Schedule change not communicated",
                    "Not reported",
                ],
                CancelledU: [
                    "Power outage on campus",
                    "Mentor emergency",
                    "Venue unavailable",
                    "Platform outage (LMS)",
                ],
                CancelledA: ["Institute event", "Guest lecture clash", "Assessment window", "Bridge holiday"],
                Rescheduled: ["Mentor request (approved)", "Clash with assessment", "Batch event"],
                Late: [
                    "Previous session overran",
                    "Mentor late arrival",
                    "Technical setup delay",
                    "Travel/traffic delay",
                ],
            };
            for (let d = T0; d <= toDn("2026-11-06"); d++) {
                if (dow(d) > 4 || HOLIDAYS[d]) continue;
                BATCHES.forEach((b, bi) => {
                    const omit = (bi + d) % 4;
                    BATCHES.find((x) => x === b).cc = b.cc || 0;
                    for (let sl = 0; sl < 4; sl++) {
                        if (sl === omit) continue;
                        let chosen = null;
                        for (let t = 0; t < b.courses.length; t++) {
                            const c = b.courses[(b.cc + t) % b.courses.length],
                                p = pairOf(b.id, c);
                            if (!busy.has(d + "|" + sl + "|" + p.mentor)) {
                                chosen = p;

                            const c = b.courses[b.cc % b.courses.length];

                        SESSIONS.push({
                            id: "SES-" + ++sn,
                            d,
                            slot: sl,
                            ps: SLOTS[sl].s,

                            outcome: d < DEMO ? "Delivered" : "Scheduled",
                            delay: 0,

            }
            SESSIONS.forEach((s) => {
                if (s.d >= DEMO) return;
                const wk = wkOf(s.d);
                let pM = 0.009,
                    pCU = 0.006,
                    pCA = 0.016,
                    pRs = 0.012,
                    pL = 0.028;
                if (s.mentor === LATE_M) pL = 0.4;
                let forced = null;
                if (s.d === LMS_OUT && s.slot === 1) forced = "CancelledU";
                if (s.mentor === ABS_M && s.d >= toDn("2026-10-07") && s.d <= LAST && s.batch === "B25-PM")
                    forced = "Missed";
                if (s.batch === "B23-CB" && wk === 7 && chance(0.14)) forced = "Missed";
                const r = rnd();
                let o =
                    forced ||
                    (r < pM
                        ? "Missed"
                        : r < pM + pCU
                          ? "CancelledU"
                          : r < pM + pCU + pCA
                            ? "CancelledA"
                            : r < pM + pCU + pCA + pRs
                              ? "Rescheduled"
                              : "Delivered");
                s.outcome = o;
                if (o === "Delivered") {
                    if (chance(pL)) {
                        s.delay = ri(6, 26);
                        s.reason = s.mentor === LATE_M && chance(0.8) ? "Mentor late arrival" : pick(REASONS.Late);
                    } else s.delay = chance(0.05) ? ri(5, 7) : ri(0, 4);
                } else if (o === "Missed") {
                    s.reason = forced ? "Mentor unavailable – illness" : pick(REASONS.Missed);
                    const old = s.d < DEMO - 10;
                    s.recovery = old
                        ? wpick(["Recovered", "Recovery scheduled", "Awaiting recovery"], [75, 15, 10])
                        : wpick(["Awaiting recovery", "Recovery scheduled"], [60, 40]);
                } else if (o === "CancelledU") {
                    s.reason = forced ? "Platform outage (LMS)" : pick(REASONS.CancelledU);
                    const old = s.d < DEMO - 10;
                    s.recovery = old
                        ? wpick(["Recovered", "Recovery scheduled", "Awaiting recovery"], [80, 10, 10])
                        : wpick(["Awaiting recovery", "Recovery scheduled"], [50, 50]);
                } else if (o === "CancelledA") {

            /* ---------- attendance (codes 0 present,1 absent,2 excused,3 late,4 unrecorded,5 not enrolled) ---------- */

                let bf = 1;

                if (s.batch === "B25-CB") bf = 1.04;
                if (s.batch === "B23-CB" && wk >= 8) bf = 0.97;
                const dowf = dw === 4 ? 0.95 : dw === 0 ? 0.975 : 1;
                const arr = new Uint8Array(b.size),
                    agg = { p: 0, l: 0, a: 0, e: 0, u: 0, x: 0 };
                const L = BSTU[s.batch];
                for (let i = 0; i < b.size; i++) {
                    const st = L[i];
                    let code;
                    if (!activeAt(st, s.d)) {
                        code = 5;
                        agg.x++;
                    } else {
                        let p = st.baseP * bf * dowf;
                        if (st.flags.drop) p *= Math.max(0.3, 1 - 0.085 * Math.max(0, wk - 2));
                        let forcedAbs = false;
                        if (st.flags.absWin && s.d >= st.flags.absWin[0] && s.d <= st.flags.absWin[1]) forcedAbs = true;

                        if (chance(0.006)) {
                            code = 4;
                            agg.u++;
                        } else if (!forcedAbs && rnd() < Math.min(0.995, p)) {
                            if (chance(0.035)) {
                                code = 3;
                                agg.l++;

                                code = 0;
                                agg.p++;
                            }

                            if (chance(forcedAbs ? 0.25 : 0.17)) {
                                code = 2;
                                agg.e++;
                            } else {
                                code = 1;
                                agg.a++;

                    arr[i] = code;

            /* ---------- assessments ---------- */
            const ASSESS = [];

            PAIRS.forEach((p) => {
                const b = BATCH[p.batch],

                ATYPES.forEach((t) => {
                    const due =
                        t.off == null

                                const pe = chance(pend);

                                if (!pe) {
                                    a.mk[i] = Math.round(
                                        clamp(
                                            s.ability + 0.3 * (s.baseP - 0.9) * 100 + gauss(0, 9) - t.diff * 1.4,
                                            2,

                                        )
                                    );
                                }
                            }
                            a.st[i] = code;
                        }
                    }
                    ASSESS.push(a);
                });
            });
            const ASSESS_BY = Object.fromEntries(ASSESS.map((a) => [a.id, a]));
            // assessment lifecycle
            ASSESS.forEach((a) => {
                const sub = a.st ? Array.from(a.st).filter((c) => c === 0 || c === 1 || c === 4 || c === 5).length : 0;
                const ev = a.st ? Array.from(a.st).filter((c) => c === 0 || c === 1).length : 0;
                a.sub = sub;
                a.evald = ev;
                a.evalPct = sub ? ev / sub : null;
                if (a.type === "End-Sem") {
                    a.stage = a.due - DEMO > 30 ? "Paper preparation" : "Paper review";
                    const done = ri(1, 4);
                    a.check = [
                        "Paper setters nominated",
                        "First draft received",
                        "Moderation review",
                        "University approval of paper",

                        "Hall tickets generated",
                        "Invigilation roster published",
                        "Accessibility accommodations confirmed",
                    ].map((n, i) => ({
                        n,
                        done: i < done || (i < 5 && chance(0.3)),
                        due: a.due - [60, 50, 40, 30, 15, 10, 8, 7][i],
                    }));
                    a.check.forEach((c) => {
                        c.late = !c.done && c.due < DEMO;
                    });
                } else if (a.due <= LAST) {
                    if (a.evalPct < 1) {
                        a.stage = "Evaluation";
                    } else {
                        a.verified = a.evalDue + ri(0, 3) <= LAST;
                        a.published = a.verified && a.evalDue + ri(3, 6) <= LAST ? a.evalDue + ri(3, 6) : null;
                        a.stage = a.published ? "Result published" : a.verified ? "Marks verification" : "Marks entry";
                    }
                    if (a.published == null && a.stage === "Result published") a.stage = "Marks verification";
                    if (a.evalPct === 1 && !a.published) {
                        a.published = a.due + ri(9, 13);
                        if (a.published > LAST) {
                            a.published = null;
                            a.stage = "Marks verification";
                        } else a.stage = "Result published";
                    }
                } else a.stage = a.due - DEMO > 14 ? "Scheduled" : a.due - DEMO > 7 ? "Paper review" : "Platform ready";
                a.overdueEval = a.due <= LAST && a.evalPct != null && a.evalPct < 1 && a.evalDue < DEMO;
            });

            /* ---------- mentor feedback, follow-up tasks ---------- */
            const MFB = [];
            let fbn = 0;
            MENTORS.forEach((m) => {
                const base =
                    clamp(gauss(4.15, 0.3), 3.2, 4.8) - (m.id === LATE_M ? 0.55 : 0) - (m.id === ABS_M ? 0.3 : 0);
                const bs = PAIRS.filter((p) => p.mentor === m.id).map((p) => p.batch);
                for (let w = 0; w < 10; w++) {
                    const n = ri(3, 9);
                    for (let i = 0; i < n; i++)
                        MFB.push({
                            id: ++fbn,
                            mentor: m.id,
                            batch: pick(bs),
                            w,
                            score: clamp(Math.round(gauss(base, 0.9)), 1, 5),
                        });
                }
            });
            const MTASKS = [];
            let mtn = 0;
            MENTORS.forEach((m) => {
                const n = ri(8, 14);
                for (let i = 0; i < n; i++) {
                    const type = pick([
                        "Student follow-up",
                        "Student follow-up",
                        "Evaluation",
                        "Review notes",
                        "Attendance entry",
                    ]);
                    const due = DEMO - ri(-6, 40);
                    const done =
                        due < DEMO - 5 ? chance(m.id === LATE_M ? 0.7 : 0.93) : due < DEMO ? chance(0.7) : chance(0.15);
                    MTASKS.push({
                        id: "MT-" + ++mtn,
                        mentor: m.id,
                        type,
                        due,
                        done,
                        doneOn: done ? Math.min(LAST, due + (chance(0.2) ? ri(1, 5) : -ri(0, 3))) : null,
                    });
                }
            });

            /* ---------- interventions (attendance follow-ups), generated after risk is computed (see metrics) ---------- */
            const INTERV = {};

            /* ---------- tickets ---------- */
            const TCATS = [
                "Academic query",
                "Fees & finance",
                "Hostel & facilities",
                "LMS / technical",
                "Timetable & classes",
                "Examination & results",
                "Attendance dispute",
                "Mentor / teaching",
                "OJT & placement",
                "Documents & certificates",
            ];
            const SLA_H = { Critical: 24, High: 48, Medium: 72, Low: 120 };
            const TICKETS = [];
            let tn = 3000;
            const SUPPORT_OWNERS = SUPPORT_STAFF;
            for (let i = 0; i < 64; i++) {
                const st = pick(STUDENTS);
                const sev = wpick(["Critical", "High", "Medium", "Low"], [8, 22, 45, 25]);
                const age = wpick([ri(0, 2), ri(2, 7), ri(7, 20), ri(20, 50)], [22, 38, 28, 12]);
                const created = DEMO - age - rnd() * 0.6;
                const cat = pick(TCATS);
                const t = {
                    id: "TKT-" + ++tn,
                    cat,
                    sev,
                    batch: st.batch,
                    student: st.id,
                    created,
                    source: chance(0.35) ? "Parent" : "Student",
                    owner: pick(SUPPORT_OWNERS),
                    notes: [],
                    summary: {
                        "Academic query": "Clarification needed on internal marks calculation",
                        "Fees & finance": "Instalment receipt not reflecting in portal",
                        "Hostel & facilities": "Wi-Fi unavailable in study block after 9 pm",

                role: "head",
                collapsed: false,
                read: {},
                ver: 0,
                dstack: [],
                f: {
                    sem: "all",
                    range: "28",
                    from: isoOf(LAST - 27),
                    to: isoOf(LAST),

                    batch: "all",

                calMonth: null,

            const ND = LAST - T0 + 1;
            const roleOf = () => ROLES.find((r) => r.id === S.role);
            const mePerson = () => (S.role === "mentor" ? MENTOR[LATE_M].name : roleOf().person);

            /* ---------- filter context ---------- */
            function Q(over = {}) {
                const f = S.f;
                let to = LAST,
                    from;
                if (f.range === "custom") {
                    from = toDn(f.from);

                } else if (f.range === "term") from = T0;

                const len = to - from + 1;
                const batches = new Set(
                    BATCHES.filter(

                return Object.assign(
                    {

                        to,
                        len,
                        pf: from - len,

                        batches,

                        course: null,

                    over

            const prevQ = (q) => Object.assign({}, q, { from: Math.max(T0 - len0(q), q.pf), to: q.pt });
            const len0 = (q) => q.len;
            const rangeLabel = (q) => `${fd(q.from)} – ${fd(q.to)}`;
            const studentsIn = (q, d = q.to) => STUDENTS.filter((s) => q.batches.has(s.batch) && activeAt(s, d));

            /* ---------- classes ---------- */
            function sst(s) {
                if (s.outcome === "Scheduled") return "Scheduled";
                if (s.outcome === "Delivered") return s.delay > CFG.lateTol ? "Late" : "On time";
                return {
                    Missed: "Missed",
                    CancelledU: "Cancelled (unplanned)",

            const sessIn = (q) =>
                SESSIONS.filter(

            function classStats(list) {
                const r = {
                    total: list.length,

                    late: 0,

                    cu: 0,
                    ca: 0,
                    resched: 0,
                    awaiting: 0,
                    recovered: 0,
                    delaySum: 0,

                list.forEach((s) => {
                    const t = sst(s);
                    if (t === "On time") r.onTime++;
                    else if (t === "Late") {
                        r.late++;
                        r.delaySum += s.delay;
                    } else if (t === "Missed") r.missed++;
                    else if (t === "Cancelled (unplanned)") r.cu++;
                    else if (t === "Cancelled (approved)") r.ca++;
                    else if (t === "Rescheduled") r.resched++;
                    if (s.recovery === "Awaiting recovery") r.awaiting++;
                    if (s.recovery === "Recovered") r.recovered++;
                });
                r.excl = CFG.excludeApprovedCancel ? r.ca + r.resched : 0;
                r.eligible = r.total - r.excl;
                r.delivered = r.onTime + r.late;
                r.ontime = r.eligible ? (r.onTime / r.eligible) * 100 : null;
                r.missedRate = r.eligible ? ((r.missed + r.cu) / r.eligible) * 100 : null;
                r.mc = r.missed + r.cu + r.ca;
                r.avgDelay = r.late ? r.delaySum / r.late : 0;
                r.breach = r.late + r.missed + r.cu;
                return r;
            }
            /* ---------- attendance ---------- */
            function attAgg(list) {
                let p = 0,
                    l = 0,
                    a = 0,
                    e = 0,
                    u = 0;
                list.forEach((s) => {
                    if (s.agg) {
                        p += s.agg.p;
                        l += s.agg.l;
                        a += s.agg.a;
                        e += s.agg.e;
                        u += s.agg.u;
                    }
                });
                const pres = p + (CFG.lateCountsPresent ? l : 0),
                    den = p + l + a;
                return { p, l, a, e, u, pres, den, rate: den ? (pres / den) * 100 : null };
            }
            /* ---------- per-student daily arrays ---------- */
            let STAT = null,
                STATKEY = "";
            function studentStats() {
                if (STAT) return STAT;
                STAT = {};
                BATCHES.forEach((b) => {
                    const L = BSTU[b.id],
                        ss = SESSIONS.filter((s) => s.batch === b.id && s.att);
                    L.forEach((st, i) => {
                        const d = [0, 1, 2, 3, 4].map(() => new Uint8Array(ND));
                        let streak = 0,
                            maxS = 0;
                        ss.forEach((s) => {
                            const c = s.att[i];
                            if (c < 5) {
                                d[c][s.d - T0]++;
                            }
                            if (c === 0 || c === 3) streak = 0;
                            else if (c === 1) {
                                streak++;
                                maxS = Math.max(maxS, streak);

                        STAT[st.id] = { d, streak, maxS };

                });
                return STAT;
            }
            function sAtt(sid, from = T0, to = LAST) {
                const st = studentStats()[sid],
                    a = from - T0,
                    b = to - T0;
                let c = [0, 0, 0, 0, 0];
                for (let k = 0; k < 5; k++) {
                    const arr = st.d[k];
                    for (let i = Math.max(0, a); i <= Math.min(ND - 1, b); i++) c[k] += arr[i];
                }
                const pres = c[0] + (CFG.lateCountsPresent ? c[3] : 0),
                    den = c[0] + c[1] + c[3];
                return {
                    pres: c[0],
                    abs: c[1],
                    exc: c[2],
                    late: c[3],
                    unr: c[4],
                    den,
                    rate: den ? (pres / den) * 100 : null,
                    streak: st.streak,
                };
            }
            /* ---------- assessments ---------- */
            function assessRecs(q) {
                const out = [];
                ASSESS.forEach((a) => {
                    if (
                        !a.st ||
                        a.due < q.from ||
                        a.due > q.to ||
                        !q.batches.has(a.batch) ||
                        (q.mentor && a.mentor !== q.mentor) ||
                        (q.course && a.course !== q.course)
                    )
                        return;
                    out.push(a);
                });
                return out;
            }
            function assessStats(q) {
                let due = 0,
                    comp = 0,
                    marks = [],
                    late = 0,
                    miss = 0,
                    pend = 0;
                const list = assessRecs(q);
                list.forEach((a) => {
                    for (let i = 0; i < a.st.length; i++) {
                        const c = a.st[i];
                        if (c === 6) continue;
                        due++;
                        if (c === 0 || c === 4) comp++;
                        else if (c === 1 || c === 5) late++;
                        else miss++;
                        if (c === 4 || c === 5) pend++;
                        if (a.mk[i] >= 0) marks.push(a.mk[i]);

                });
                return {
                    due,
                    comp,
                    late,
                    miss,
                    pend,
                    rate: due ? (comp / due) * 100 : null,
                    avg: marks.length ? avg(marks) : null,
                    median: median(marks),
                    pass: marks.length ? (marks.filter((m) => m >= CFG.passMark).length / marks.length) * 100 : null,
                    marks,

            /* ---------- risk ---------- */
            let RISK = null,
                RISKKEY = "";
            const cfgRiskKey = () =>

                    CFG.riskAtt,

                    CFG.passMark,

            function riskMap() {
                const key = cfgRiskKey();
                if (RISK && RISKKEY === key) return RISK;
                RISKKEY = key;
                RISK = {};

                STUDENTS.forEach((s) => {
                    if (s.leave != null && s.leave <= LAST) return;
                    const at = sAtt(s.id),
                        reasons = [];
                    if (at.rate != null && at.rate < CFG.riskAtt)
                        reasons.push({ k: "att", t: `Attendance ${at.rate.toFixed(0)}% is below ${CFG.riskAtt}%` });
                    if (at.streak >= CFG.riskConsec)
                        reasons.push({ k: "consec", t: `${at.streak} consecutive unexcused absences` });
                    const w = [7, 8, 9].map((w) => [Math.max(T0, wkStart(w)), Math.min(LAST, wkStart(w) + 6)]);
                    const rec = sAtt(s.id, wkStart(7), LAST),
                        prior = sAtt(s.id, wkStart(3), wkStart(7) - 1);
                    const drop = rec.rate != null && prior.rate != null ? prior.rate - rec.rate : 0;
                    if (drop >= CFG.riskDrop)
                        reasons.push({ k: "drop", t: `Attendance fell ${drop.toFixed(0)} pp in the last 3 weeks` });
                    let fails = 0,
                        miss = 0,
                        taken = 0;
                    ASSESS.forEach((a) => {
                        if (a.batch !== s.batch || !a.st) return;
                        const c = a.st[s.idx];
                        if (c === 6) return;
                        taken++;
                        if (c === 2 || c === 3) miss++;
                        if (a.mk[s.idx] >= 0 && a.mk[s.idx] < CFG.passMark) fails++;
                    });
                    if (fails >= CFG.riskFail)
                        reasons.push({ k: "fail", t: `Below pass mark in ${fails} assessments` });
                    if (miss >= CFG.riskMissing)
                        reasons.push({ k: "miss", t: `${miss} missing or absent assessments` });
                    const level =
                        reasons.length === 0
                            ? "None"
                            : reasons.length >= 2 || (at.rate != null && at.rate < 65)
                              ? "High"
                              : "Medium";
                    RISK[s.id] = { reasons, level, att: at.rate, drop, fails, miss, taken, streak: at.streak };
                });
                return RISK;
            }
            const riskOf = (sid) => riskMap()[sid] || { reasons: [], level: "None" };
            function ensureInterv() {
                if (Object.keys(INTERV).length) return;
                const saved = CFG;
                CFG = { ...CFG0 };
                RISKKEY = "";
                const rm = riskMap();

                    const r = rm[s.id];

                    const stt = wpick(
                        [
                            "Not contacted",
                            "Student contacted",
                            "Parent informed",
                            "Meeting scheduled",
                            "Improving",
                            "Resolved",
                            "Escalated",
                        ],
                        [16, 18, 22, 14, 12, 10, 8]
                    );
                    INTERV[s.id] = {
                        status: stt,
                        student: stt !== "Not contacted",
                        parent:
                            stt === "Not contacted"
                                ? "Not contacted"
                                : wpick(
                                      ["SMS sent", "Call connected", "Call not answered", "Meeting done"],
                                      [25, 40, 20, 15]
                                  ),
                        next: stt === "Resolved" ? null : DEMO + ri(-3, 8),
                        outcome:
                            stt === "Resolved"
                                ? "Attendance recovered above threshold"
                                : stt === "Improving"
                                  ? "Attending again; monitor 2 weeks"
                                  : stt === "Escalated"
                                    ? "Escalated to Head of Academics"
                                    : "—",
                        log: [],
                    };
                });
                CFG = saved;
                RISKKEY = "";
            }
            /* ---------- tickets, tasks, compliance as-of ---------- */
            const tOpen = (t, d = DEMO) => t.created <= d && (t.resolved == null || t.resolved > d);
            const tBreach = (t, d = DEMO) => tOpen(t, d) && d > t.slaDue;
            const tktScope = (q) => TICKETS.filter((t) => q.batches.has(t.batch));
            const tskOverdue = (t, d) => t.due < d && !(t.status === "Completed" && t.done != null && t.done < d);
            const compRisk = (u, d) => {
                const sub = u.submitted != null && u.submitted <= d;
                return !sub && u.due <= d + 10 && u.due >= d - 60;
            };
            const isStale = (t) => t.status === "In progress" && DEMO - t.lastUpd >= 5;
            function tktStats(list, from, to) {
                const res = list.filter((t) => t.resolved != null && t.resolved >= from && t.resolved < to + 1);
                const inSla = res.filter((t) => t.resolved <= t.slaDue).length;
                const frs = list
                    .filter((t) => t.firstResp != null && t.created >= from && t.created < to + 1)
                    .map((t) => (t.firstResp - t.created) * 24);
                return {
                    res: res.length,
                    inSla,
                    sla: res.length ? (inSla / res.length) * 100 : null,
                    created: list.filter((t) => t.created >= from && t.created < to + 1).length,
                    medRes: median(res.map((t) => (t.resolved - t.created) * 24)),
                    firstResp: frs.length ? avg(frs) : null,
                };
            }
            /* ---------- metric registry (Trends & KPIs) ---------- */
            const MET = {
                att: {
                    label: "Attendance",
                    unit: "%",
                    up: true,
                    target: () => CFG.attTarget,
                    calc: (q) => {
                        const a = attAgg(sessIn(q));

                    },
                    def: "Present (and late, if configured) student-session records ÷ all eligible student-session records. Excused, unrecorded and not-enrolled records are excluded from the denominator.",
                },
                ontime: {
                    label: "On-time class delivery",
                    unit: "%",
                    up: true,
                    target: () => CFG.ontimeTarget,
                    calc: (q) => {

                        return { v: c.ontime, n: c.onTime, d: c.eligible };
                    },
                    def: "Classes starting within the late tolerance ÷ eligible scheduled classes. Missed and unplanned cancellations stay in the denominator; approved cancellations and approved reschedules are excluded (configurable).",
                },
                missed: {
                    label: "Missed-class rate",
                    unit: "%",
                    up: false,
                    target: () => 3,
                    calc: (q) => {

                    },
                    def: "Missed sessions plus unplanned cancellations ÷ scheduled classes requiring delivery.",
                },
                assess: {
                    label: "Assessment completion",
                    unit: "%",
                    up: true,
                    target: () => CFG.assessTarget,
                    calc: (q) => {

                        return { v: a.rate, n: a.comp, d: a.due };
                    },
                    def: "Student assessments submitted by the deadline ÷ student assessments due in the period. Late and missing submissions count as not completed.",
                },
                score: {

                    unit: "%",
                    up: true,
                    target: () => 65,
                    calc: (q) => {
                        const a = assessStats(q);
                        return { v: a.avg, n: a.marks.length, d: a.marks.length };
                    },
                    def: "Mean percentage score across evaluated student assessments due in the period (unevaluated papers excluded).",
                },
                slaIssue: {
                    label: "Issue SLA compliance",
                    unit: "%",
                    up: true,
                    target: () => CFG.slaTarget,
                    calc: (q) => {

                        return { v: s.sla, n: s.inSla, d: s.res };
                    },
                    def: "Issues resolved within their SLA ÷ issues resolved during the period.",
                },
                taskOn: {
                    label: "On-time task completion",
                    unit: "%",
                    up: true,
                    target: () => CFG.taskTarget,
                    calc: (q) => {

                        const n = l.filter((t) => t.status === "Completed" && t.done <= t.due).length;
                        return { v: l.length ? (n / l.length) * 100 : null, n, d: l.length };
                    },
                    def: "Operational tasks completed on or before their due date ÷ tasks falling due in the period (institution-wide; not batch-filtered).",
                },

            const pct = (v, d = 1) => (v == null || isNaN(v) ? "—" : v.toFixed(d) + "%");
            function bucketRange(q, gran) {

            function series(key, q, gran = "weekly") {

            /* min 8 weeks window for trend charts */
            const trendQ = (q) => {
                const from = Math.min(q.from, LAST - 7 * 8 + 1);
                return Object.assign({}, q, { from: Math.max(T0, from) });
            };

            /* ---------- KPI cards ---------- */
            function kpiList() {
                const q = Q(),
                    pq = prevQ(q);
                const cur = q.to,
                    prv = q.pt;
                const out = [];
                const st = (v, tgt, up, warnBand) => {

                };

                });

                    up: false,

                    view: "sla",

                });

                });

                    prev: odp,

                    view: "operations",

                });
                const ts = tktScope(q),
                    ot = ts.filter((t) => tOpen(t, DEMO)),

                // o:{cols:[labels],rows:[{label,cells:[{v,text,tip,color,act,arg}],act,arg}], lw}
                const cols = o.cols.length;
                return `<div class="tw nomax" style="padding:6px;overflow:auto"><div class="hm" style="grid-template-columns:${o.lw || 110}px repeat(${cols},minmax(${o.cw || 42}px,1fr))">
    <div class="hh"></div>${o.cols.map((c) => `<div class="hh">${esc(c)}</div>`).join("")}
    ${o.rows.map((r) => `<div class="hl" ${r.act ? `data-act="${r.act}" data-arg="${esc(r.arg)}" style="cursor:pointer"` : ""} title="${esc(r.label)}">${esc(r.label)}</div>${r.cells.map((c) => `<div class="cell" style="background:${c.color || "transparent"}" ${c.tip ? tipAttr(c.tip) : ""} ${c.act ? `data-act="${c.act}" data-arg="${esc(c.arg)}"` : ""}>${c.text ?? ""}</div>`).join("")}`).join("")}
  </div></div>`;
            }
            function funnel(rows, o = {}) {
                const max = rows[0]?.v || 1;
                return `<div style="display:flex;flex-direction:column;gap:4px">${rows
                    .map((r, i) => {
                        const p = (r.v / max) * 100,
                            drop = i ? rows[i - 1].v - r.v : 0;
                        return `<div class="row" style="flex-wrap:nowrap;gap:8px;${r.act ? "cursor:pointer" : ""}" ${r.act ? `data-act="${r.act}" data-arg="${esc(r.arg)}"` : ""}><div style="width:${o.lw || 150}px;flex:none;color:var(--ink2)">${esc(r.label)}</div>
    <div style="flex:1"><div style="width:${Math.max(p, 2)}%;height:22px;border-radius:5px;background:${r.color || "var(--c1)"};opacity:${1 - i * 0.06};display:flex;align-items:center;padding:0 8px;color:#fff;font-weight:600;font-size:12px" ${tipAttr(r.label + ": " + fint(r.v) + (i ? " (" + ((r.v / rows[i - 1].v) * 100).toFixed(0) + "% of previous step)" : ""))}>${fint(r.v)}</div></div>
    <div class="nw muted" style="width:92px;flex:none;font-size:11.5px">${i && drop > 0 ? "−" + fint(drop) + " (" + ((drop / rows[i - 1].v) * 100).toFixed(0) + "%)" : ""}</div></div>`;
                    })
                    .join("")}</div>`;
            }
            function gantt(o) {
                // o:{rows:[{label,sub,start,end,done,color,act,arg,tip}],from,to}
                const lw = o.lw || 190,
                    w = o.w || 900,
                    rh = 22,
                    m = { t: 26, r: 12, b: 6 },
                    h = m.t + o.rows.length * rh + m.b,
                    iw = w - lw - m.r;
                const X = (d) => lw + ((d - o.from) / (o.to - o.from)) * iw;
                let g = "";
                for (let d = o.from; d <= o.to; d += 7) {
                    g += `<line class="gl" x1="${X(d)}" x2="${X(d)}" y1="${m.t - 6}" y2="${h - m.b}"/><text x="${X(d) + 2}" y="${m.t - 10}">${fd(d)}</text>`;
                }
                if (DEMO >= o.from && DEMO <= o.to)
                    g += `<line x1="${X(DEMO)}" x2="${X(DEMO)}" y1="${m.t - 6}" y2="${h - m.b}" stroke="var(--bad)" stroke-width="1.5"/><text x="${X(DEMO) + 3}" y="${h - m.b - 2}" style="fill:var(--bad)">Today</text>`;
                o.rows.forEach((r, i) => {
                    const y = m.t + i * rh;
                    g += `<text x="${lw - 8}" y="${y + 14}" text-anchor="end" ${r.act ? 'class="clkable"' : ""}>${esc(r.label.length > 30 ? r.label.slice(0, 29) + "…" : r.label)}</text>`;
                    const x0 = X(Math.max(r.start, o.from)),
                        x1 = X(Math.min(r.end, o.to));
                    g += `<rect x="${x0}" y="${y + 4}" width="${Math.max(3, x1 - x0)}" height="${rh - 9}" rx="4" style="fill:${r.color || "var(--c1)"};opacity:.88" class="clkable" ${tipAttr(r.tip || r.label)} ${r.act ? `data-act="${r.act}" data-arg="${esc(r.arg)}"` : ""}/>`;
                    if (r.done != null && r.done < r.end)
                        g += `<rect x="${x0}" y="${y + 4}" width="${Math.max(0, ((x1 - x0) * r.done) / 100)}" height="${rh - 9}" rx="4" fill="#fff" opacity=".28"/>`;
                });
                return `<div style="overflow:auto"><svg class="ch" style="min-width:${Math.min(w, 820)}px" viewBox="0 0 ${w} ${h}">${g}</svg></div>`;
            }
            const empty = (t = "Nothing to show", s = "No records match the current filters.") =>
                `<div class="empty"><b>${esc(t)}</b>${esc(s)}</div>`;

            /* ---------- card & layout helpers ---------- */
            function card(title, body, o = {}) {
                return `<section class="card ${o.cls || ""}" ${o.id ? `id="${o.id}"` : ""}><div class="hd"><div><h3>${title}${o.info ? ` <button class="info" data-act="def" data-arg="${esc(o.info)}" aria-label="Definition">?</button>` : ""}</h3>${o.sub ? `<div class="sub" style="margin:2px 0 0">${o.sub}</div>` : ""}</div>${o.right || ""}</div>${body}</section>`;
            }
            function tabsBar(view, tabs, def) {
                const cur = S.tab[view] || def;
                return `<div class="tabs" role="tablist">${tabs.map((t) => `<button role="tab" class="${cur === t[0] ? "on" : ""}" data-act="tab" data-arg="${view}|${t[0]}" aria-selected="${cur === t[0]}">${esc(t[1])}</button>`).join("")}</div>`;
            }
            const curTab = (view, def) => S.tab[view] || def;
            function segCtl(id, opts, cur) {
                return `<div class="seg" role="group">${opts.map((o) => `<button class="${cur === o[0] ? "on" : ""}" data-act="seg" data-arg="${id}|${o[0]}">${esc(o[1])}</button>`).join("")}</div>`;
            }
            const segv = (id, def) => S.tab["seg:" + id] ?? def;
            function metricRow(items) {
                return `<div class="g g5" style="margin-bottom:12px">${items.map((i) => `<div class="kpi s-${i.tone || ""}" ${i.act ? `data-act="${i.act}" data-arg="${esc(i.arg)}" role="button" tabindex="0" style="cursor:pointer"` : ""}><div class="kl"><span>${i.label}</span>${i.info ? `<button class="info" data-act="def" data-arg="${esc(i.info)}">?</button>` : ""}</div><div class="kv">${i.v}${i.u ? `<small>${i.u}</small>` : ""}</div><div class="km">${i.sub || ""}</div></div>`).join("")}</div>`;
            }
            function kpiCard(k) {
                const val = k.v == null ? "—" : k.fmt === "pct" ? k.v.toFixed(1) + "<small>%</small>" : fint(k.v);
                const lbl = { good: "On target", warn: "Watch", bad: "Off target", neu: "Info" }[k.status];
                return `<button class="kpi s-${k.status}" data-act="kpi" data-arg="${k.id}" aria-label="${esc(k.label)}: ${k.v == null ? "no data" : k.v}. Open details">
   <div class="kl"><span>${esc(k.label)}</span><span class="info" data-act="def" data-arg="${esc(k.hint)}" role="button" aria-label="Definition">?</span></div>
   <div class="kv">${val}</div>
   <div class="km">${k.sub ? `<span>${esc(k.sub)}</span>` : ""}</div>
   <div class="km"><span>${esc(k.target)}</span></div>
   <div class="km">${k.delta != null ? dlt(k.delta, k.dUnit, k.up) : '<span class="dl flat">—</span>'}<span>vs prev. period${k.prev != null ? " (" + (k.fmt === "pct" ? k.prev.toFixed(1) + "%" : fint(k.prev)) + ")" : ""}</span><span class="pill ${tone(k.status)}" style="margin-left:auto">${lbl}</span></div>
   ${k.spark ? spark(k.spark, k.status === "bad" ? "var(--bad)" : k.status === "warn" ? "var(--warn)" : "var(--accent)") : ""}</button>`;
            }

            /* ---------- data table component ---------- */
            const TB = {};
            function table(id, cfg) {
                TB[id] = cfg;
                const st =
                    S.tbl[id] ||
                    (S.tbl[id] = { q: "", sort: cfg.sort ?? null, dir: cfg.dir || "desc", page: 0, f: {} });
                if (cfg.reset) {
                    st.page = 0;
                }
                return `<div id="tb-${id}">${tableInner(id)}</div>`;
            }
            function tableRows(id) {
                const cfg = TB[id],
                    st = S.tbl[id];
                let rows = cfg.rows;
                (cfg.filters || []).forEach((f) => {
                    const v = st.f[f.k];
                    if (v) rows = rows.filter((r) => String(f.get(r)) === v);
                });
                if (st.q) {
                    const q = st.q.toLowerCase();
                    rows = rows.filter((r) =>
                        (cfg.search
                            ? cfg.search(r)
                            : cfg.cols.map((c) => (c.csv ? c.csv(r) : c.v ? c.v(r) : r[c.k])).join(" ")
                        )
                            .toString()
                            .toLowerCase()
                            .includes(q)
                    );
                }
                if (st.sort != null) {
                    const c = cfg.cols[st.sort];
                    if (c) {
                        const g = c.v || ((r) => r[c.k]);
                        rows = [...rows].sort((a, b) => {
                            let x = g(a),
                                y = g(b);
                            if (x == null) return 1;
                            if (y == null) return -1;
                            return (typeof x === "string" ? x.localeCompare(y) : x - y) * (st.dir === "asc" ? 1 : -1);
                        });
                    }
                }
                return rows;
            }
            function tableInner(id) {
                const cfg = TB[id],
                    st = S.tbl[id],
                    rows = tableRows(id),
                    ps = cfg.pageSize || 12,
                    pages = Math.max(1, Math.ceil(rows.length / ps));
                if (st.page >= pages) st.page = pages - 1;
                const view = rows.slice(st.page * ps, st.page * ps + ps);
                const fl = (cfg.filters || [])
                    .map((f) => {
                        const opts = [...new Set(cfg.rows.map((r) => String(f.get(r))))].sort();
                        return `<select class="sel" data-tf="${id}|${f.k}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}: all</option>${opts.map((o) => `<option ${st.f[f.k] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
                    })
                    .join("");
                return `<div class="tbar">${cfg.noSearch ? "" : `<input class="inp" data-tq="${id}" placeholder="Search…" value="${esc(st.q)}" aria-label="Search table">`}${fl}<span class="muted" style="font-size:12px">${fint(rows.length)} of ${fint(cfg.rows.length)} records</span><span class="sp"></span>${cfg.extra || ""}${cfg.csv ? `<button class="btn sm" data-act="csv" data-arg="${id}">${ic("copy")} Export CSV</button>` : ""}</div>
  <div class="tw ${cfg.nomax ? "nomax" : ""}" ${cfg.maxh ? `style="max-height:${cfg.maxh}px"` : ""}><table class="dt"><thead><tr>${cfg.cols.map((c, i) => `<th class="${c.cls || ""}" data-sort="${id}|${i}" ${c.tip ? tipAttr(c.tip) : ""} aria-sort="${st.sort === i ? (st.dir === "asc" ? "ascending" : "descending") : "none"}">${esc(c.h)}${st.sort === i ? `<span class="arr">${st.dir === "asc" ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead>
  <tbody>${view.length ? view.map((r, ri) => `<tr class="${cfg.open ? "clk" : ""}" ${cfg.open ? `data-row="${id}|${st.page * ps + ri}"` : ""}>${cfg.cols.map((c) => `<td class="${c.cls || ""} ${c.wrap ? "wrap" : ""}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${cfg.cols.length}">${empty(cfg.emptyTitle || "No matching records", "Adjust the search, table filters or global filters.")}</td></tr>`}</tbody></table></div>
  ${pages > 1 ? `<div class="pager"><span>Page ${st.page + 1} of ${pages}</span><button class="btn sm" data-pg="${id}|-1" ${st.page === 0 ? "disabled" : ""}>${ic("left")}</button><button class="btn sm" data-pg="${id}|1" ${st.page >= pages - 1 ? "disabled" : ""}>${ic("right")}</button></div>` : ""}`;
            }
            function refreshTable(id, focusSel) {
                const el = $("#tb-" + id);
                if (!el) return;
                const a = document.activeElement,
                    pos = a && a.selectionStart;
                el.innerHTML = tableInner(id);
                if (focusSel) {
                    const i = $(focusSel, el);
                    if (i) {
                        i.focus();
                        try {
                            i.setSelectionRange(pos, pos);
                        } catch (e) {}
                    }
                }
            }
            function csvOf(id) {
                const cfg = TB[id],
                    rows = tableRows(id),
                    q = (v) => {
                        v = String(v ?? "").replace(/<[^>]+>/g, "");
                        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
                    };
                return [
                    cfg.cols.map((c) => q(c.h)).join(","),
                    ...rows.map((r) => cfg.cols.map((c) => q(c.csv ? c.csv(r) : c.v ? c.v(r) : r[c.k])).join(",")),
                ].join("\n");
            }
            function copyText(t, cb) {
                const fb = () => {
                    const ta = $("#csvta");
                    if (ta) {
                        ta.focus();
                        ta.select();
                    }
                    toast("Select the text and copy it (Ctrl/Cmd+C)");
                };
                try {
                    navigator.clipboard.writeText(t).then(() => toast("Copied to clipboard"), fb);

            /* ---------- persistence of demo edits ---------- */
            const P = { patches: {}, newActions: [], interv: {}, read: {}, cfg: null };
            const REG = {
                tkt: TKT,
                tsk: TSK,
                comp: UCR,
                ses: Object.fromEntries(SESSIONS.map((s) => [s.id, s])),
                dq: Object.fromEntries(DQLOG.map((d) => [d.id, d])),
                ojt: OJTR,
                inc: INCR,
                act: {},
            };
            function reindexActions() {
                REG.act = Object.fromEntries(ACTIONS.map((a) => [a.id, a]));
            }
            function loadMut() {
                try {
                    const raw = localStorage.getItem("polaris-mis-demo-v1");
                    if (!raw) return;
                    const d = JSON.parse(raw);
                    (d.newActions || []).forEach((a) => {
                        ACTIONS.push(a);
                        acn = Math.max(acn, +a.id.slice(4) - 400);
                    });
                    reindexActions();
                    Object.entries(d.patches || {}).forEach(([k, f]) => {
                        const [c, id] = k.split(":");
                        if (REG[c] && REG[c][id]) Object.assign(REG[c][id], f);
                    });
                    Object.assign(P.patches, d.patches || {});
                    P.newActions = d.newActions || [];
                    if (d.interv) {
                        ensureInterv();
                        Object.entries(d.interv).forEach(([sid, o]) => {
                            INTERV[sid] = Object.assign(INTERV[sid] || { log: [] }, o);
                        });
                        P.interv = d.interv;
                    }
                    S.read = d.read || {};
                    if (d.cfg) CFG = Object.assign({}, CFG0, d.cfg);
                } catch (e) {}
            }
            function saveMut() {
                try {
                    P.read = S.read;
                    P.cfg = CFG;
                    localStorage.setItem("polaris-mis-demo-v1", JSON.stringify(P));
                } catch (e) {}
            }
            function mutate(coll, id, fields) {
                const o = REG[coll][id];
                Object.assign(o, fields);
                if (coll === "act" && P.newActions.find((a) => a.id === id)) {
                    Object.assign(
                        P.newActions.find((a) => a.id === id),
                        fields
                    );
                } else {
                    P.patches[coll + ":" + id] = Object.assign(P.patches[coll + ":" + id] || {}, fields);
                }
                S.ver++;
                saveMut();
            }
            function mutInterv(sid, fields) {

                INTERV[sid] = Object.assign(
                    INTERV[sid] || {
                        status: "Not contacted",
                        student: false,
                        parent: "Not contacted",
                        next: null,
                        outcome: "—",
                        log: [],
                    },
                    fields
                );
                P.interv[sid] = INTERV[sid];
                S.ver++;
                saveMut();
            }
            function createAction(o) {
