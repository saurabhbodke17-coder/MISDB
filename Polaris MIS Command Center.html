                                            ? `<span class="lk" data-act="openLink" data-arg="${r.link[0]}|${esc(r.link[1])}">${r.link[0]} ${esc(r.link[1])}</span>`
                                            : "—",
                                    csv: (r) => (r.link ? r.link.join(" ") : ""),
                                },
                            ],
                            rows: sets[cur],
                            open: (r) => ["action", r.id],
                            csv: "actions-" + cur,
                            pageSize: 10,
                            sort: 6,
                            dir: "asc",
                            filters: [
                                { k: "s", label: "Status", get: (r) => r.status },
                                { k: "d", label: "Origin", get: (r) => r.dash },
                                { k: "o", label: "Owner", get: (r) => r.owner },
                            ],
                            search: (r) => [r.id, r.issue, r.owner, r.root, r.dash].join(" "),
                            emptyTitle: "No actions in this view",
                        }),
                        {
                            right: `<button class="btn sm pri" data-act="newAction">${ic("plus")} New action</button>`,
                            sub: "Every action links back to the originating class, student, process, incident or compliance record.",
                        }
                    );
                } else if (cur === "roots") {
                    const rc = ROOTS.map((r) => ({
                        label: r,
                        v: A.filter((a) => a.root === r).length,
                        tone: A.filter((a) => a.root === r).length >= 5 ? "bad" : "warn",
                    })).sort((a, b) => b.v - a.v);
                    const byFn = FUNCTIONS.map((f) => ({ f, l: A.filter((a) => a.fn === f) })).filter(
                        (x) => x.l.length
                    );
                    body = `<div class="g g2">${card("Repeat root causes", hbars(rc, { lw: 170, vw: 30 }), { sub: "Root causes appearing in 3+ actions indicate a systemic problem rather than a one-off" })}${card(
                        "Root cause by function",
                        heatmap({
                            cols: ROOTS.map((r) => r.split(" ")[0]),
                            rows: byFn.map((x) => ({
                                label: x.f,
                                cells: ROOTS.map((r) => {
                                    const n = x.l.filter((a) => a.root === r).length;
                                    return {
                                        text: n || "·",
                                        color: n ? heatSeq(n / 4) : "transparent",
                                        tip: `${x.f} · ${r}: ${n}`,
                                    };
                                }),
                            })),
                            lw: 150,
                            cw: 52,
                        }),
                        { sub: "Columns: " + ROOTS.join(" · ") }
                    )}</div>`;
                } else {
                    const by = (key, items) =>
                        items
                            .map((k) => {
                                const l = A.filter((a) => a[key] === k);
                                return {
                                    k,
                                    total: l.length,
                                    closed: l.filter(actClosed).length,
                                    verify: l.filter((a) => a.status.startsWith("Done")).length,
                                    over: l.filter(actOver).length,
                                    rate: l.length ? (l.filter(actClosed).length / l.length) * 100 : null,
                                };
                            })
                            .filter((r) => r.total);
                    const cols = [
                        { h: "", k: "k" },
                        { h: "Actions", k: "total", cls: "r" },
                        { h: "Closed", k: "closed", cls: "r" },
                        { h: "Awaiting verification", k: "verify", cls: "r" },
                        { h: "Overdue", k: "over", cls: "r", f: (r) => (r.over ? `<b class="bad">${r.over}</b>` : 0) },
                        { h: "Closure rate", k: "rate", cls: "r", f: (r) => pct(r.rate, 0), v: (r) => r.rate },
                    ];
                    body = `<div class="g g2">${card("Closure rate by owner", table("clo-o", { cols: cols.map((c, i) => (i ? c : { ...c, h: "Owner" })), rows: by("owner", [...new Set(A.map((a) => a.owner))]), noSearch: true, sort: 1, dir: "desc", pageSize: 10, nomax: true, csv: "closure-owner" }))}${card("Closure rate by function", table("clo-f", { cols: cols.map((c, i) => (i ? c : { ...c, h: "Function" })), rows: by("fn", FUNCTIONS), noSearch: true, sort: 1, dir: "desc", nomax: true, csv: "closure-function" }))}</div>`;
                }
                return (
                    H(
                        "Action & Audit Center",
                        "The accountability layer: every exception becomes an action with an owner, a due date, a root cause and verified evidence.",
                        `<button class="btn pri" data-act="newAction">${ic("plus")} New action</button>`
                    ) +
                    metrics +
                    tabs +
                    body
                );
            };

            /* ============ DETAIL DRAWERS & FORMS ============ */
            const kvs = (items) =>
                `<div class="kv2">${items.map((i) => `<div><small>${i[0]}</small><b>${i[1]}</b></div>`).join("")}</div>`;
            const dlist = (items) =>
                `<dl class="dl2">${items
                    .filter(Boolean)
                    .map((i) => `<dt>${i[0]}</dt><dd>${i[1]}</dd>`)
                    .join("")}</dl>`;
            const notesHTML = (n) =>
                n && n.length
                    ? `<div class="tl">${n
                          .slice()
                          .reverse()
                          .map(
                              (x) =>
                                  `<div><b>${esc(x.by)}</b> <small>${typeof x.t === "number" ? fd(Math.floor(x.t)) : x.t}</small><div>${esc(x.txt)}</div></div>`
                          )
                          .join("")}</div>`
                    : '<div class="muted">No notes yet.</div>';
            const ownerOptions = (cur) => {
                const all = [
                    ...new Set([
                        ...Object.values(STAFF),
                        ...SUPPORT_STAFF,
                        ...IT_STAFF,
                        ...Object.values(MANAGERS),
                        ...Object.values(FN_OWNERS).flat(),
                    ]),
                ].sort();
                return all.map((o) => `<option ${o === cur ? "selected" : ""}>${esc(o)}</option>`).join("");
            };
            const opt = (arr, cur) =>
                arr.map((o) => `<option ${o === cur ? "selected" : ""}>${esc(o)}</option>`).join("");
            const NOWTS = DEMO + 0.45;
            const val = (id) => {
                const e = $("#" + id);
                return e ? e.value : "";
            };
            function dBreadcrumb() {
                const nav = NAVMAP[S.view];
                return [nav ? nav.label : "MIS", ...S.dstack.map(([t, i]) => DLABEL(t, i))].map(esc).join(" › ");
            }
            const DLABEL = (t, i) =>
                ({
                    batch: "Batch " + i,
                    mentor: MENTOR[i]?.name,
                    student: i,
                    session: i,
                    ticket: i,
                    task: i,
                    incident: i,
                    project: i,
                    compliance: i,
                    exception: "Exception",
                    action: i,
                    assessment: i,
                    dq: i,
                    process: "Process",
                    defs: "Definitions",
                    settings: "Settings",
                    system: i,
                    dqgroup: "Data quality",
                })[t] || i;
            function openD(type, id, push = true) {
                const last = S.dstack[S.dstack.length - 1];
                if (push && !(last && last[0] === type && last[1] === id)) S.dstack.push([type, id]);
                renderDrawer();
            }
            function renderDrawer() {
                const dr = $("#drawer"),
                    sc = $("#scrim");
                if (!S.dstack.length) {
                    dr.classList.remove("on");
                    sc.classList.remove("on");
                    dr.innerHTML = "";
                    return;
                }
                const [type, id] = S.dstack[S.dstack.length - 1];
                let d;
                try {
                    d = DR[type](id);
                } catch (e) {
                    console.error(e);
                    d = {
                        title: "Unable to open record",
                        sub: "",
                        body: `<div class="errbox">${esc(e.message)}</div>`,
                    };
                }
                dr.innerHTML = `<div class="dhead">${S.dstack.length > 1 ? `<button class="iconbtn" data-act="dback" aria-label="Back">${ic("left")}</button>` : ""}<div style="flex:1;min-width:0"><div class="muted" style="font-size:11px">${dBreadcrumb()}</div><h2>${d.title}</h2>${d.sub ? `<div class="muted">${d.sub}</div>` : ""}</div><button class="iconbtn" data-act="dclose" aria-label="Close panel">${ic("x")}</button></div><div class="dbody">${d.body}</div>`;
                dr.classList.add("on");
                sc.classList.add("on");
            }
            function closeDrawer() {
                S.dstack = [];
                renderDrawer();
            }
            const DR = {};
            const kpiStrip = (q) => {
                const a = MET.att.calc(q),
                    o = MET.ontime.calc(q),
                    s = assessStats(q);
                return kvs([
                    ["Attendance", pct(a.v)],
                    ["On-time delivery", pct(o.v)],
                    ["Assessment completion", pct(s.rate)],
                    ["Avg score", pct(s.avg)],
                ]);
            };
            /* ----- batch ----- */
            DR.batch = (id) => {
                const b = BATCH[id];
                if (!b) return { title: "Batch not found", body: empty() };
                const q = Object.assign(Q(), { batches: new Set([id]) }),
                    tq = trendQ(q),
                    wk = weeksOf(tq),
                    rm = riskMap();
                const studs = studentsIn(q)
                    .filter((s) => rm[s.id] && rm[s.id].level !== "None")
                    .sort((a, b) => (rm[a.id].level === "High" ? 0 : 1) - (rm[b.id].level === "High" ? 0 : 1));
                const tks = TICKETS.filter((t) => t.batch === id && tOpen(t));
                const row = batchRows(q)[0];
                return {
                    title: `${id} · ${b.name}`,
                    sub: `Semester ${b.sem} · ${b.size} students · Manager ${MANAGERS[id]}`,
                    body:
                        `<div class="row">${statusPill(row.health)}<button class="btn sm" data-act="setBatch" data-arg="${id}">Filter whole dashboard to this batch</button><button class="btn sm pri" data-act="createFor" data-arg="batch|${id}">${ic("plus")} Create action</button></div>` +
                        kpiStrip(q) +
                        card(
                            "Weekly attendance & on-time delivery",
                            lineChart({
                                labels: wk.map(wLabel),
                                series: [
                                    {
                                        name: "Attendance",
                                        vals: wk.map((w) => MET.att.calc(Object.assign({}, q, wq(tq, w))).v),
                                    },
                                    {
                                        name: "On-time delivery",
                                        vals: wk.map((w) => MET.ontime.calc(Object.assign({}, q, wq(tq, w))).v),
                                        color: "var(--c3)",
                                    },
                                ],
                                min: 50,
                                max: 100,
                                target: CFG.attTarget,
                                w: 560,
                                h: 200,
                                title: "Batch trend",
                            })
                        ) +
                        card(
                            "Mentors & courses",
                            `<table class="dt"><tbody>${PAIRS.filter((p) => p.batch === id)
                                .map((p) => {
                                    const cs = classStats(sessIn(Object.assign({}, q, { course: p.course })));
                                    return `<tr><td>${esc(COURSE[p.course].name)}</td><td>${lk("mentor", p.mentor, MENTOR[p.mentor].name)}</td><td class="r">${pct(cs.ontime, 0)} on time</td></tr>`;
                                })
                                .join("")}</tbody></table>`
                        ) +
                        card(
                            `Students at risk (${studs.length})`,
                            studs.length
                                ? `<table class="dt"><tbody>${studs
                                      .slice(0, 8)
                                      .map(
                                          (s) =>
                                              `<tr class="clk" data-act="open" data-arg="student|${s.id}"><td>${s.id}<div class="muted" style="font-size:11px">${esc(s.name)}</div></td><td>${statusPill(rm[s.id].level)}</td><td>${rm[s.id].reasons.map((r) => esc(r.t)).join("<br>")}</td></tr>`
                                      )
                                      .join("")}</tbody></table>`
                                : '<div class="muted">No students flagged.</div>'
                        ) +
                        card(
                            `Open tickets (${tks.length})`,
                            tks.length
                                ? `<table class="dt"><tbody>${tks
                                      .slice(0, 6)
                                      .map(
                                          (t) =>
                                              `<tr class="clk" data-act="open" data-arg="ticket|${t.id}"><td>${t.id}</td><td>${esc(t.summary)}</td><td>${sevPill(t.sev)}</td><td>${tBreach(t) ? '<span class="pill bad">SLA breach</span>' : ""}</td></tr>`
                                      )
                                      .join("")}</tbody></table>`
                                : '<div class="muted">No open tickets.</div>'
                        ),
                };
            };
            /* ----- mentor ----- */
            DR.mentor = (id) => {
                const m = MENTOR[id];
                if (!m) return { title: "Mentor not found", body: empty() };
                const q = Q(),
                    c = mentorCard(id, q),
                    tq = trendQ(q),
                    wk = weeksOf(tq),
                    all = new Set(BATCHES.map((b) => b.id));
                const sessions = SESSIONS.filter(
                    (s) => s.mentor === id && s.d < DEMO && ["Late", "Missed", "Cancelled (unplanned)"].includes(sst(s))
                )
                    .sort((a, b) => b.d - a.d)
                    .slice(0, 10);
                const mt = MTASKS.filter((t) => t.mentor === id && !t.done && t.due <= DEMO + 7);
                const fb = MFB.filter((f) => f.mentor === id),
                    dist = [1, 2, 3, 4, 5].map((s) => fb.filter((f) => f.score === s).length);
                return {
                    title: m.name,
                    sub: `${id} · ${c.courses.map((p) => p.batch + " " + COURSE[p.course].name).join(" · ")}`,
                    body:
                        `<div class="row"><button class="btn sm pri" data-act="createFor" data-arg="mentor|${id}">${ic("plus")} Create action</button><button class="btn sm" data-act="setMentor" data-arg="${id}">Filter dashboard to this mentor</button>${c.repeat ? '<span class="pill bad">Repeat SLA breaches</span>' : ""}</div>` +
                        kvs([
                            ["Assigned classes", c.cs.total],
                            ["On-time delivery", pct(c.cs.ontime)],
                            ["Late starts", c.cs.late],
                            ["Missed / cancelled", c.cs.missed + c.cs.cu],
                            ["Avg delay", c.cs.late ? c.cs.avgDelay.toFixed(0) + " min" : "—"],
                            ["Evaluation completion", pct(c.evalRate, 0)],
                            ["Feedback (adj.)", c.fb == null ? "—" : `${c.fb.toFixed(2)} (${c.adj.toFixed(2)})`],
                            ["Follow-ups done", pct(c.fu, 0)],
                            ["Pending tasks", c.pend],
                        ]) +
                        card(
                            "Weekly on-time delivery",
                            lineChart({
                                labels: wk.map(wLabel),
                                series: [
                                    {
                                        name: m.name,
                                        vals: wk.map(
                                            (w) =>
                                                MET.ontime.calc(
                                                    Object.assign({}, wq(tq, w), { batches: all, mentor: id })
                                                ).v
                                        ),
                                        area: true,
                                    },
                                ],
                                target: CFG.ontimeTarget,
                                min: 0,
                                max: 100,
                                w: 560,
                                h: 190,
                                title: "Mentor trend",
                            })
                        ) +
                        card(
                            "Recent SLA exceptions",
                            sessions.length
                                ? `<table class="dt"><tbody>${sessions.map((s) => `<tr class="clk" data-act="open" data-arg="session|${s.id}"><td>${fd(s.d)} ${hm(s.ps)}</td><td>${s.batch} · ${esc(COURSE[s.course].name)}</td><td>${statusPill(sst(s))}</td><td class="r">${s.outcome === "Delivered" ? s.delay + " min" : ""}</td></tr>`).join("")}</tbody></table>`
                                : '<div class="muted">No exceptions recorded.</div>'
                        ) +
                        card(
                            "Feedback distribution",
                            barChart({
                                labels: ["1", "2", "3", "4", "5"],
                                series: [{ name: "Responses", vals: dist, color: "var(--c4)" }],
                                w: 560,
                                h: 150,
                                title: "Feedback",
                            }),
                            { sub: `${fb.length} responses this term` }
                        ) +
                        card(
                            "Pending tasks",
                            mt.length
                                ? `<table class="dt"><tbody>${mt.map((t) => `<tr><td>${t.id}</td><td>${t.type}</td><td>Due ${fd(t.due)}</td><td>${t.due < DEMO ? '<span class="pill bad">Overdue</span>' : '<span class="pill warn">Due soon</span>'}</td></tr>`).join("")}</tbody></table>`
                                : '<div class="muted">None pending.</div>'
                        ),
                };
            };
            /* ----- student ----- */
            DR.student = (id) => {
                const s = STU[id];
                if (!s) return { title: "Student not found", body: empty() };
                const a = sAtt(id),
                    r = riskOf(id),
                    hist = studentAssess(s),
                    iv = (ensureInterv(), INTERV[id]),
                    tks = TICKETS.filter((t) => t.student === id);
                const wk = [...Array(10).keys()].map((w) => sAtt(id, wkStart(w), Math.min(LAST, wkStart(w) + 6)).rate);
                const ivv = iv || {
                    status: "Not contacted",
                    student: false,
                    parent: "Not contacted",
                    next: null,
                    outcome: "—",
                    log: [],
                };
                return {
                    title: s.name,
                    sub: `${s.id} · ${s.batch} · Sem ${s.sem} · ${SPECS[s.spec]} (synthetic record)`,
                    body:
                        `<div class="row">${r.level !== "None" ? statusPill(r.level) : '<span class="pill good">No risk flags</span>'}<button class="btn sm" data-act="open" data-arg="batch|${s.batch}">Batch overview</button><button class="btn sm pri" data-act="createFor" data-arg="student|${id}">${ic("plus")} Create action</button></div>` +
                        (r.reasons.length
                            ? card(
                                  "Why this student is flagged",
                                  `<ul style="margin:0;padding-left:18px">${r.reasons.map((x) => `<li>${esc(x.t)}</li>`).join("")}</ul>`,
                                  { sub: "Rule-based flags with the thresholds in Settings" }
                              )
                            : "") +
                        kvs([
                            ["Attendance (term)", pct(a.rate, 0)],
                            ["Present", a.pres],
                            ["Absent", a.abs],
                            ["Excused", a.exc],
                            ["Late", a.late],
                            ["Unrecorded", a.unr],
                            ["Consecutive absences", a.streak],
                            ["Avg score", pct(stuAvg(s), 0)],
                        ]) +
                        card(
                            "Weekly attendance",
                            barChart({
                                labels: wk.map((_, i) => "W" + (i + 1)),
                                series: [
                                    {
                                        name: "Attendance",
                                        vals: wk.map((v) => (v == null ? 0 : Math.round(v))),
                                        colors: wk.map((v) =>
                                            v == null ? "var(--neu)" : v < CFG.riskAtt ? "var(--bad)" : "var(--c1)"
                                        ),
                                        color: "var(--c1)",
                                    },
                                ],
                                max: 100,
                                fmt: (v) => v + "%",
                                w: 560,
                                h: 160,
                                title: "Weekly attendance",
                            })
                        ) +
                        card(
                            "Assessment history",
                            hist.length
                                ? `<table class="dt"><thead><tr><th>Course</th><th>Assessment</th><th>Due</th><th>Status</th><th class="r">Mark</th></tr></thead><tbody>${hist.map((h) => `<tr><td>${esc(COURSE[h.a.course].name)}</td><td>${h.a.name}</td><td>${fd(h.a.due)}</td><td>${["Completed", "Submitted late", "Missing", "Absent", "Awaiting evaluation", "Late · awaiting"][h.code]}</td><td class="r">${h.mark >= 0 ? `<b class="${h.mark < CFG.passMark ? "bad" : ""}">${h.mark}%</b>` : "—"}</td></tr>`).join("")}</tbody></table>`
                                : '<div class="muted">No assessments yet.</div>',
                            {
                                sub:
                                    "Trajectory: " +
                                    (hist
                                        .filter((h) => h.mark >= 0)
                                        .map((h) => h.mark)
                                        .join(" → ") || "—"),
                            }
                        ) +
                        card(
                            "Intervention",
                            `<div class="muted" style="margin-bottom:8px">Follow-up owner: ${esc(s.manager)} · Parent contact on file: ${s.parentOk ? "yes" : '<b class="bad">missing</b>'}</div><div class="form"><label>Status<select class="sel" id="iv-status">${opt(["Not contacted", "Student contacted", "Parent informed", "Meeting scheduled", "Improving", "Resolved", "Escalated"], ivv.status)}</select></label><label>Parent communication<select class="sel" id="iv-parent">${opt(["Not contacted", "SMS sent", "Call connected", "Call not answered", "Meeting done"], ivv.parent)}</select></label><label>Next follow-up<input class="inp" type="date" id="iv-next" value="${ivv.next ? isoOf(ivv.next) : ""}"></label><label class="full">Note / outcome<input class="inp" id="iv-note" placeholder="What happened in this follow-up?" value=""></label></div><div class="row" style="margin-top:8px"><button class="btn pri" data-act="saveInterv" data-arg="${id}">Save follow-up</button></div>${ivv.outcome && ivv.outcome !== "—" ? `<div class="muted" style="margin-top:8px">Latest outcome: ${esc(ivv.outcome)}</div>` : ""}${ivv.log && ivv.log.length ? notesHTML(ivv.log) : ""}`
                        ) +
                        (tks.length
                            ? card(
                                  "Tickets",
                                  `<table class="dt"><tbody>${tks.map((t) => `<tr class="clk" data-act="open" data-arg="ticket|${t.id}"><td>${t.id}</td><td>${esc(t.summary)}</td><td>${statusPill(t.status)}</td></tr>`).join("")}</tbody></table>`
                              )
                            : "") +
                        (s.ojt
                            ? card(
                                  "OJT project",
                                  `${lk("project", s.ojt)} · ${esc(OJTR[s.ojt].title)} · ${statusPill(OJTR[s.ojt].status)}`
                              )
                            : ""),
                };
            };
            /* ----- session ----- */
            DR.session = (id) => {
                const s = REG.ses[id];
                if (!s) return { title: "Session not found", body: empty() };
                const L = BSTU[s.batch],
                    ab = [];
                if (s.att)
                    s.att.forEach((c, i) => {
                        if (c === 1 || c === 2 || c === 4) ab.push({ s: L[i], c });
                    });
                const a = s.agg ? attAgg([s]) : null;
                return {
                    title: `${s.id} · ${COURSE[s.course].name}`,
                    sub: `${s.batch} · ${fdy(s.d)} ${hm(s.ps)}–${hm(s.pe)} · ${statusPill(sst(s))}`,
                    body:
                        `<div class="row"><button class="btn sm pri" data-act="createFor" data-arg="session|${id}">${ic("plus")} Create action</button>${["Missed", "Cancelled (unplanned)"].includes(sst(s)) && s.recovery !== "Recovered" ? `<button class="btn sm" data-act="schedRec" data-arg="${id}">Schedule recovery</button><button class="btn sm" data-act="doneRec" data-arg="${id}">Mark recovered</button>` : ""}</div>` +
                        dlist([
                            ["Mentor", lk("mentor", s.mentor, MENTOR[s.mentor].name)],
                            ["Batch", lk("batch", s.batch)],
                            ["Planned", hm(s.ps) + "–" + hm(s.pe)],
                            [
                                "Actual start",
                                s.outcome === "Delivered"
                                    ? hm(s.ps + s.delay) + (s.delay ? ` (${s.delay} min late)` : " (on time)")
                                    : "—",
                            ],
                            ["Reason", esc(s.reason || "—")],
                            ["Recovery", statusPill(s.recovery)],
                            s.revised ? ["Revised date", fdy(s.revised)] : null,
                            ["Responsible owner", esc(s.owner)],
                            ["SLA rule", `Late if start is more than ${CFG.lateTol} minutes after schedule`],
                        ]) +
                        (a
                            ? kvs([
                                  ["Attendance", pct(a.rate, 0)],
                                  ["Present", a.p],
                                  ["Late", a.l],
                                  ["Absent", a.a],
                                  ["Excused", a.e],
                                  ["Unrecorded", a.u],
                              ]) +
                              card(
                                  `Absent, excused or unrecorded (${ab.length})`,
                                  ab.length

            /* ----- ticket ----- */
            DR.ticket = (id) => {

                    body:
                        `<div class="card"><b>${esc(t.summary)}</b><div class="muted">Raised by ${t.source.toLowerCase()} ${lk("student", t.student)} · batch ${lk("batch", t.batch)}</div></div>` +
                        dlist([
                            ["Created", fdt(t.created)],
                            ["SLA deadline", `<span class="${tBreach(t) ? "bad b" : ""}">${fdt(t.slaDue)}</span>`],
                            [
                                "First response",
                                t.firstResp
                                    ? fdt(t.firstResp) + ` (${fh((t.firstResp - t.created) * 24)})`

                            ],

                            ["Last update", fdt(t.lastUpd)],

                            t.fb ? ["Feedback", "★".repeat(t.fb) + "☆".repeat(5 - t.fb)] : null,

                                  `<div class="form"><label>Reassign to<select class="sel" id="tk-owner">${ownerOptions(t.owner)}</select></label><label>Status<select class="sel" id="tk-status">${opt(["Open", "In progress", "Waiting on student", "Escalated"], t.status)}</select></label><label>Next action<input class="inp" id="tk-next" value="${esc(t.next)}"></label><label class="full">Add note<textarea class="inp" id="tk-note" rows="2" placeholder="Update for the audit trail"></textarea></label></div><div class="row" style="margin-top:8px"><button class="btn pri" data-act="saveTicket" data-arg="${id}">Save changes</button><button class="btn" data-act="escTicket" data-arg="${id}">Escalate</button><button class="btn" data-act="closeTicket" data-arg="${id}">Resolve & close</button><button class="btn" data-act="createFor" data-arg="ticket|${id}">${ic("plus")} Create action</button></div>`
                              )
                            : `<div class="row"><button class="btn" data-act="reopenTicket" data-arg="${id}">Reopen ticket</button></div>`) +
                        card(
                            "Activity",
                            notesHTML([
                                { t: t.created, by: "System", txt: "Ticket created (" + t.source + ")" },
                                ...(t.firstResp ? [{ t: t.firstResp, by: t.owner, txt: "First response sent" }] : []),

                                ...(t.resolved ? [{ t: t.resolved, by: t.owner, txt: "Resolved" }] : []),

                };
            };
            /* ----- task ----- */
            DR.task = (id) => {
                const t = TSK[id];
                if (!t) return { title: "Task not found", body: empty() };
                const p = PROCESSES.find((x) => x.id === t.proc),
                    dep = t.dep ? TSK[t.dep] : null;
                return {
                    title: `${t.title}`,
                    sub: `${t.id} · ${t.pname} · step ${t.step} of ${t.seq} · ${statusPill(t.status)}${isStale(t) ? ' <span class="pill warn nodot">Stale</span>' : ""}`,
                    body:
                        dlist([
                            ["Owner", esc(t.owner)],
                            ["Function", t.fn],
                            [
                                "Planned",
                                `${fd(t.start)} → ${fd(t.due)}${t.overdue ? ` · <b class="bad">${DEMO - t.due} days overdue</b>` : ""}`,
                            ],
                            ["Progress", `${t.progress}%`],
                            ["Last update", daysAgo(t.lastUpd)],
                            ["Blocker", esc(t.blocker || "—")],
                            ["Delay reason", esc(t.delayReason || "—")],
                            ["Next action", esc(t.next)],
                            ["Escalation", escName(t.escalation)],
                            ["Depends on", dep ? lk("task", dep.id, dep.title) + " " + statusPill(dep.status) : "None"],

                        card(
                            "Update task",
                            `<div class="form"><label>Status<select class="sel" id="tsk-status">${opt(["Not started", "In progress", "Blocked", "On hold", "Completed"], t.status)}</select></label><label>Progress %<input class="inp" type="number" id="tsk-prog" min="0" max="100" value="${t.progress}"></label><label>Escalation<select class="sel" id="tsk-esc">${[0, 1, 2, 3].map((l) => `<option value="${l}" ${l === t.escalation ? "selected" : ""}>${escName(l)}</option>`).join("")}</select></label><label>Blocker<input class="inp" id="tsk-blk" value="${esc(t.blocker || "")}"></label><label class="full">Next action<input class="inp" id="tsk-next" value="${esc(t.next === "—" ? "" : t.next)}"></label></div><div class="row" style="margin-top:8px"><button class="btn pri" data-act="saveTask" data-arg="${id}">Save</button><button class="btn" data-act="createFor" data-arg="task|${id}">${ic("plus")} Create action</button><button class="btn" data-act="open" data-arg="process|${t.proc}">View process</button></div>`
                        ),
                };
            };
            DR.process = (id) => {
                const p = PROCESSES.find((x) => x.id === id);
                return {
                    title: p.name,
                    sub: p.fn,
                    body: `<div class="flow" style="flex-direction:column">${p.tasks.map((t) => `<div class="node ${t.status === "Completed" ? "done" : t.status === "Blocked" ? "blocked" : t.overdue ? "late" : ""}" style="max-width:none" data-act="open" data-arg="task|${t.id}"><b>${t.step}. ${esc(t.title)}</b> ${statusPill(t.status)}<div class="muted">Due ${fd(t.due)} · ${esc(t.owner)}</div></div>`).join("")}</div>`,
                };

            /* ----- incident ----- */
            DR.incident = (id) => {
                const i = INCR[id];
                if (!i) return { title: "Incident not found", body: empty() };
                return {
                    title: `${i.id} · ${i.sys}`,
                    sub: `${i.sev} · ${i.impact} · ${i.status}`,

                            ["Started", fdt(i.start)],
                            [
                                "Ended",
                                i.end ? fdt(i.end) + ` (${Math.round(i.min)} min)` : '<b class="bad">Ongoing</b>',

                            ["Affected batches", esc(i.batches.join(", "))],
                            ["Owner", esc(i.owner)],
                            ["Root cause", esc(i.root)],
                            ["Corrective action", esc(i.fix)],

                              )

                            "Other incidents on this system",
                            `<table class="dt"><tbody>${INC.filter((x) => x.sys === i.sys && x.id !== id)

                                    (x) =>
                                        `<tr class="clk" data-act="open" data-arg="incident|${x.id}"><td>${x.id}</td><td>${fd(Math.floor(x.start))}</td><td>${x.sev}</td><td>${esc(x.root)}</td></tr>`

            };
            DR.system = (id) => {
                S.tab.techSys = id;

            /* ----- OJT project ----- */
            DR.project = (id) => {
                const p = OJTR[id];

                        ),
                };

            /* ----- exception ----- */
            DR.exception = (key) => {
                const e = EXC().find((x) => x.key === key);
                if (!e)
                    return {
                        title: "Exception cleared",
                        sub: "This exception no longer meets its rule.",
                        body: empty("Exception cleared", "The underlying records no longer breach the rule."),

                const a = actionFor(e);
                return {
                    title: e.title,

                            ["Age", e.age + " days"],
                            ["Deadline", fdy(e.deadline)],

                            ["Detail", esc(e.detail || "—")],

                                a ? statusPill(a.status) : '<span class="pill bad">No action assigned</span>',
                            ],
                        ]) +
                        `<div class="row"><button class="btn" data-act="openLink" data-arg="${e.link[0]}|${esc(e.link[1])}">Open underlying record</button><button class="btn" data-act="go" data-arg="${e.dash}">Open ${esc(NAVMAP[e.dash]?.label || e.dash)}</button></div>` +

                                  "Create an action",
                                  `<div class="form"><label>Owner<select class="sel" id="ex-owner">${ownerOptions(e.owner)}</select></label><label>Due date<input class="inp" type="date" id="ex-due" value="${isoOf(Math.max(DEMO + 1, e.deadline))}"></label><label>Severity<select class="sel" id="ex-sev">${opt(["Critical", "High", "Medium", "Low"], e.sev)}</select></label><label>Root cause<select class="sel" id="ex-root">${opt(ROOTS, "Process gap")}</select></label><label class="full">Corrective action<input class="inp" id="ex-fix" value="${esc(e.next)}"></label></div><div class="row" style="margin-top:8px"><button class="btn pri" data-act="mkActionForm" data-arg="${esc(key)}">Create action</button></div>`
                              )),
                };
            };
            /* ----- action ----- */
            DR.action = (id) => {
                const a = REG.act[id];
                if (!a) return { title: "Action not found", body: empty() };
                return {
                    title: a.issue,
                    sub: `${a.id} · ${a.dash} · ${statusPill(a.status)} ${sevPill(a.severity)}${actOver(a) ? ` <span class="pill bad">${DEMO - a.due} days overdue</span>` : ""}`,
                    body:
                        dlist([
                            ["Owner", esc(a.owner)],
                            ["Created", fd(a.created)],
                            ["Due", fd(a.due)],
                            ["Function", a.fn],
                            ["Root cause", esc(a.root)],
                            ["Corrective action", esc(a.fix || "—")],
                            ["Resolution evidence", a.evidence ? `<span class="mono">${esc(a.evidence)}</span>` : "—"],
                            ["Verification", a.verify],
                            [
                                "Source record",
                                a.link
                                    ? `<span class="lk" data-act="openLink" data-arg="${a.link[0]}|${esc(a.link[1])}">${a.link[0]} ${esc(a.link[1])}</span>`
                                    : "—",
                            ],
                        ]) +
                        card(
                            "Manage action",
                            `<div class="form"><label>Owner<select class="sel" id="ac-owner">${ownerOptions(a.owner)}</select></label><label>Due date<input class="inp" type="date" id="ac-due" value="${isoOf(a.due)}"></label><label>Status<select class="sel" id="ac-status">${opt(ACTION_STATUS, a.status)}</select></label><label>Severity<select class="sel" id="ac-sev">${opt(["Critical", "High", "Medium", "Low"], a.severity)}</select></label><label>Root cause<select class="sel" id="ac-root">${opt(ROOTS, a.root)}</select></label><label>Evidence ref<input class="inp" id="ac-ev" value="${esc(a.evidence)}" placeholder="e.g. EVD-2041"></label><label class="full">Corrective action<input class="inp" id="ac-fix" value="${esc(a.fix)}"></label><label class="full">Add note<textarea class="inp" id="ac-note" rows="2"></textarea></label></div><div class="row" style="margin-top:8px"><button class="btn pri" data-act="saveAction" data-arg="${id}">Save</button><button class="btn" data-act="escAction" data-arg="${id}">Escalate</button><button class="btn" data-act="doneAction" data-arg="${id}">Mark done</button><button class="btn" data-act="verifyAction" data-arg="${id}" ${a.status === "Done – awaiting verification" ? "" : "disabled"}>Verify & close</button><button class="btn" data-act="reopenAction" data-arg="${id}" ${actClosed(a) || a.status.startsWith("Done") ? "" : "disabled"}>Reopen</button></div>`
                        ) +
                        card("Audit trail", notesHTML(a.notes)),
                };
            };
            /* ----- assessment ----- */
            DR.assessment = (id) => {
                const a = ASSESS_BY[id];
                if (!a) return { title: "Not found", body: empty() };
                const L = BSTU[a.batch],
                    rows = a.st ? L.map((s, i) => ({ s, code: a.st[i], m: a.mk[i] })).filter((r) => r.code !== 6) : [];
                const marks = rows.filter((r) => r.m >= 0).map((r) => r.m);
                return {
                    title: `${COURSE[a.course].name} · ${a.name}`,
                    sub: `${a.id} · ${a.batch} · ${fdy(a.due)} · ${a.stage}`,
                    body:
                        `<div class="row"><button class="btn sm pri" data-act="createFor" data-arg="assessment|${id}">${ic("plus")} Create action</button></div>` +
                        dlist([
                            ["Evaluator", lk("mentor", a.mentor, MENTOR[a.mentor].name)],
                            ["Evaluation deadline", fd(a.evalDue)],
                            ["Max marks", a.max],
                            a.published ? ["Published", fd(a.published)] : null,
                        ]) +
                        (a.st
                            ? kvs([
                                  ["Submitted", a.sub],
                                  ["Evaluated", `${a.evald} (${Math.round((a.evalPct || 0) * 100)}%)`],
                                  ["Avg mark", pct(avg(marks), 0)],
                                  ["Median", pct(median(marks), 0)],
                                  [
                                      "Pass",
                                      pct(
                                          marks.length
                                              ? (marks.filter((m) => m >= CFG.passMark).length / marks.length) * 100
                                              : null,
                                          0
                                      ),
                                  ],
                              ])
                            : "") +
                        (a.check
                            ? card(
                                  "Readiness checklist",
                                  `<table class="dt"><tbody>${a.check.map((c, i) => `<tr><td><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-act="toggleCheck" data-arg="${id}|${i}" ${c.done ? "checked" : ""}> ${esc(c.n)}</label></td><td>Due ${fd(c.due)}</td><td>${c.done ? '<span class="pill good">Done</span>' : c.late ? '<span class="pill bad">Overdue</span>' : '<span class="pill">Pending</span>'}</td></tr>`).join("")}</tbody></table>`
                              )
                            : "") +
                        (rows.length
                            ? card(
                                  "Student results",
                                  table("asres", {
                                      cols: [
                                          {
                                              h: "Student",
                                              k: "s",
                                              f: (r) =>
                                                  lk("student", r.s.id) +
                                                  ` <span class="muted">${esc(r.s.name)}</span>`,
                                              v: (r) => r.s.id,
                                          },
                                          { h: "Status", k: "c", f: (r) => ASC[r.code], v: (r) => r.code },
                                          {
                                              h: "Mark",
                                              k: "m",
                                              cls: "r",
                                              v: (r) => r.m,
                                              f: (r) =>

                                                      ? `<b class="${r.m < CFG.passMark ? "bad" : ""}">${r.m}%</b>`
                                                      : "—",

                                      dir: "asc",
                                      search: (r) => r.s.id + " " + r.s.name,

                              )
                            : ""),

            DR.dq = (id) => {

                    title: `${d.id} · ${d.cat}`,
                    sub: `${d.src} · ${d.status}`,
                    body:
                        dlist([
                            ["Record", lk("student", d.rec)],
                            ["Batch", lk("batch", d.batch)],
                            ["Detected", fdy(d.det)],

                            ["Unresolved for", d.fixed ? "Resolved " + fd(d.fixed) : LAST - d.det + 1 + " days"],

                            ["Repeat error", d.repeat ? "Yes" : "No"],

                        `<div class="row"><button class="btn pri" data-act="dqSet" data-arg="${id}|Corrected – awaiting verification">Mark corrected</button><button class="btn" data-act="dqSet" data-arg="${id}|Verified">Verify</button><button class="btn" data-act="dqSet" data-arg="${id}|Reopened">Reopen</button><button class="btn" data-act="createFor" data-arg="dq|${id}">${ic("plus")} Create action</button></div>`,
                };
            };
            DR.dqgroup = (src) => {
                S.tab.dqF = { src };
                S.tab.dq = "log";
                S.dstack = [];

                return { title: "Data quality", body: "" };
            };
            DR.defs = () => ({
                title: "KPI definitions",
                sub: "Every metric: numerator, denominator and treatment of exceptions",
                body: `<dl class="defs">${Object.values(MET)
                    .map((m) => `<dt>${m.label}</dt><dd>${m.def}</dd>`)
                    .join("")}
 <dt>Data error rate</dt><dd>Incorrect records detected ÷ records checked (weekly audit samples per source system).</dd><dt>First-time-right rate</dt><dd>Records accepted without correction ÷ records reviewed.</dd><dt>Integration success rate</dt><dd>Successful integration transactions ÷ total valid transactions. Rejected-by-validation records are excluded.</dd><dt>Parent communication coverage</dt><dd>Required parent contacts completed ÷ parent contacts due.</dd><dt>Students at risk</dt><dd>Students with at least one risk rule triggered (see Exception & Risk Center → Rules). Counted once even when several rules apply.</dd><dt>Issue counting</dt><dd>A ticket that is both critical and overdue is counted once in totals and appears in both filtered views.</dd><dt>Time window</dt><dd>Flow metrics use the selected date range; snapshot metrics (open tickets, overdue tasks) are measured at the end of the range. The comparison period is the equal-length period immediately before.</dd></dl>`,
            });
            DR.settings = () => ({
                title: "Settings & metric rules",
                sub: "Illustrative rules; changes recalculate every view",
                body:
                    card(
                        "Thresholds",
                        `<div class="form">${[
                            ["lateTol", "Late start tolerance (min)"],
                            ["attTarget", "Attendance target %"],
                            ["ontimeTarget", "On-time delivery target %"],
                            ["assessTarget", "Assessment completion target %"],
                            ["slaTarget", "Issue SLA target %"],
                            ["taskTarget", "Task on-time target %"],
                            ["passMark", "Pass mark %"],
                            ["riskAtt", "Risk: attendance below %"],
                            ["riskConsec", "Risk: consecutive absences ≥"],
                            ["riskDrop", "Risk: 3-week decline ≥ pp"],
                            ["riskFail", "Risk: failed assessments ≥"],
                            ["riskMissing", "Risk: missing assessments ≥"],
                        ]
                            .map(
                                ([k, l]) =>
                                    `<label>${l}<input class="inp" type="number" data-in="cfg:${k}" value="${CFG[k]}"></label>`
                            )
                            .join(

                    ensureInterv();
                    const cur = INTERV[a] || { log: [] };
                    const log = (cur.log || []).concat(note ? [{ t: DEMO, by: mePerson(), txt: note }] : []);
                    mutInterv(a, {
                        status: st,
                        parent: val("iv-parent"),
                        student: st !== "Not contacted",
                        next: nx ? toDn(nx) : null,
                        outcome: note || cur.outcome || "—",
                        log,
                    });
                    toast("Follow-up saved");
                    renderDrawer();
                    render(true);
                },
                saveTicket: (a) => {
                    const t = TKT[a],
                        note = val("tk-note"),
                        owner = val("tk-owner"),
                        st = val("tk-status");
                    const notes = t.notes.concat(
                        [
                            {
                                t: NOWTS,
                                by: mePerson(),
                                txt:
                                    (owner !== t.owner ? `Reassigned to ${owner}. ` : "") +
                                    (st !== t.status ? `Status → ${st}. ` : "") +
                                    note,
                            },
                        ].filter((n) => n.txt.trim())
                    );
                    mutate("tkt", a, {
                        owner,
                        status: st,
                        next: val("tk-next"),
                        notes,
                        lastUpd: NOWTS,
                        firstResp: t.firstResp || NOWTS,
                    });
                    toast("Ticket updated");
                    renderDrawer();
                    render(true);
                },
                escTicket: (a) => {
                    const t = TKT[a];
                    mutate("tkt", a, {
                        status: "Escalated",
                        sev: t.sev === "Low" ? "Medium" : t.sev === "Medium" ? "High" : "Critical",
                        owner: STAFF.ops,
                        lastUpd: NOWTS,
                        notes: t.notes.concat([{ t: NOWTS, by: mePerson(), txt: "Escalated to Head of Operations." }]),
                    });
                    toast("Ticket escalated to Head of Operations");
                    renderDrawer();
                    render(true);
                },
                closeTicket: (a) => {
                    const t = TKT[a];
                    mutate("tkt", a, {
                        status: "Resolved",
                        resolved: DEMO,
                        lastUpd: DEMO,
                        next: "—",
                        notes: t.notes.concat([{ t: NOWTS, by: mePerson(), txt: "Resolved and closed." }]),
                    });
                    toast(`${a} resolved`);
                    renderDrawer();
                    render(true);
                },
                reopenTicket: (a) => {
                    const t = TKT[a];
                    mutate("tkt", a, {
                        status: "Open",
                        resolved: null,
                        lastUpd: NOWTS,
                        next: "Review and respond",
                        notes: t.notes.concat([{ t: NOWTS, by: mePerson(), txt: "Reopened." }]),
                    });
                    toast(`${a} reopened`);
                    renderDrawer();
                    render(true);
                },
                newTicket: () =>
                    modal(
                        "New ticket",
                        `<div class="form"><label>Student ID<input class="inp" id="nt-stu" list="stulist" placeholder="e.g. ${STUDENTS[0].id}"><datalist id="stulist">${STUDENTS.slice(
                            0,
                            60
                        )
                            .map((s) => `<option value="${s.id}">${esc(s.name)}</option>`)
                            .join(
                                ""
                            )}</datalist></label><label>Category<select class="sel" id="nt-cat">${opt(TCATS)}</select></label><label>Severity<select class="sel" id="nt-sev">${opt(["Low", "Medium", "High", "Critical"], "Medium")}</select></label><label>Raised by<select class="sel" id="nt-src">${opt(["Student", "Parent"])}</select></label><label class="full">Summary<input class="inp" id="nt-sum"></label></div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="mkTicket">Create ticket</button></div>`
                    ),
                mkTicket: () => {
                    const st = STU[val("nt-stu").trim()];
                    if (!st) {
                        toast("Enter a valid student ID from the demo data");
                        return;
                    }
                    const sev = val("nt-sev");
                    const t = {
                        id: "TKT-" + ++tn,
                        cat: val("nt-cat"),
                        sev,
                        batch: st.batch,
                        student: st.id,
                        created: NOWTS,
                        source: val("nt-src"),
                        owner: SUPPORT_STAFF[0],
                        notes: [],
                        summary: val("nt-sum") || "New request",
                        slaDue: NOWTS + SLA_H[sev] / 24,
                        firstResp: null,
                        lastUpd: NOWTS,
                        next: "Acknowledge and assign",
                        status: "Open",
                    };
                    TICKETS.push(t);
                    TKT[t.id] = t;
                    REG.tkt[t.id] = t;
                    S.ver++;
                    closeModal();
                    toast(t.id + " created");
                    render(true);
                    openD("ticket", t.id);
                },
                saveTask: (a) => {
                    const st = val("tsk-status"),
                        t = TSK[a];
                    const f = {
                        status: st,
                        progress: +val("tsk-prog") || 0,
                        escalation: +val("tsk-esc"),
                        blocker: val("tsk-blk") || null,
                        next: val("tsk-next") || "—",
                        lastUpd: DEMO,
                    };
                    if (st === "Completed") {
                        f.done = DEMO;
                        f.progress = 100;
                        f.next = "—";
                    } else f.done = null;
                    f.overdue = st !== "Completed" && t.due < DEMO;
                    mutate("tsk", a, f);
                    toast("Task updated");
                    renderDrawer();
                    render(true);
                },
                resolveInc: (a) => {
                    const i = INCR[a];
                    mutate("inc", a, {
                        end: DEMO + 0.4,
                        status: "Resolved",
                        min: Math.round((DEMO + 0.4 - i.start) * 1440),
                    });
                    toast(a + " resolved");
                    renderDrawer();
                    render(true);
                },
                saveComp: (a) => {
                    mutate("comp", a, { ready: +val("uc-ready"), disc: +val("uc-disc"), ref: val("uc-ref") });
                    toast("Milestone updated");
                    renderDrawer();
                    render(true);
                },
                advComp: (a) => {
                    const u = UCR[a],
                        ns = u.stage + 1,
                        f = { stage: ns };
                    if (ns === 1) f.ready = Math.max(u.ready, 90);
                    if (ns >= 2) {
                        f.submitted = DEMO;
                        f.ready = 100;
                        f.overdue = false;
                        f.late = DEMO > u.due;
                    }
                    if (ns >= 3) f.acked = DEMO;
                    if (ns >= 4) f.approved = DEMO;
                    f.approval =
                        ns === 4
                            ? "Approved"
                            : ns === 3
                              ? "Under review"
                              : ns === 2
                                ? "Submitted – awaiting acknowledgement"
                                : "Not submitted";
                    mutate("comp", a, f);
                    toast("Moved to: " + UST[ns]);
                    renderDrawer();
                    render(true);
                },
                escComp: (a) => {
                    mutate("comp", a, { esc: Math.min(3, UCR[a].esc + 1) });
                    toast("Escalation level raised");
                    renderDrawer();
                    render(true);
                },
                toggleCheck: (a) => {
                    const [id, i] = sp2(a),
                        as = ASSESS_BY[id],
                        ch = as.check.map((c, k) =>
                            k === +i ? Object.assign({}, c, { done: !c.done, late: false }) : c
                        );
                    mutate("asm", id, { check: ch });
                    renderDrawer();
                    render(true);
                },
                dqSet: (a) => {
                    const [id, st] = sp2(a);
                    const f = { status: st };
                    if (st.startsWith("Corrected")) f.fixed = LAST;
                    if (st === "Verified") {
                        f.ver = LAST;
                        f.fixed = REG.dq[id].fixed || LAST;
                    }
                    if (st === "Reopened") f.fixed = null;
                    mutate("dq", id, f);
                    toast(id + ": " + st);
                    renderDrawer();
                    render(true);
                },
                /* actions */
                mkAction: (a) => {
                    const e = EXC().find((x) => x.key === a);
                    if (!e) return;
                    const ac = createAction({
                        exKey: e.key,
                        dash: e.dash,
                        issue: e.title,
                        severity: e.sev === "Medium" ? "Medium" : e.sev,
                        owner: e.owner,
                        due: Math.max(DEMO + 1, Math.min(e.deadline, DEMO + 7)),
                        fix: e.next,
                        fn: fnOfArea(e.area),
                        link: e.link,
                        status: "Open",
                    });
                    toast(`${ac.id} created · owner ${ac.owner} · due ${fd(ac.due)}`);
                    rerender();
                },
                mkActionForm: (a) => {
                    const e = EXC().find((x) => x.key === a);
                    const ac = createAction({
                        exKey: e.key,
                        dash: e.dash,
                        issue: e.title,
                        severity: val("ex-sev"),
                        owner: val("ex-owner"),
                        due: readDate("ex-due", DEMO + 3),
                        root: val("ex-root"),
                        fix: val("ex-fix"),
                        fn: fnOfArea(e.area),
                        link: e.link,
                    });
                    toast(`${ac.id} created`);
                    renderDrawer();
                    render(true);
                },
                createFor: (a) => {
                    const [t, id] = sp2(a);
                    const label = {
                        batch: "Batch " + id,
                        mentor: MENTOR[id]?.name,
                        student: id,
                        session: id,
                        ticket: id,
                        task: id,
                        incident: id,
                        project: id,
                        compliance: id,
                        assessment: id,
                        dq: id,
                    }[t];
                    const ac = createAction({
                        dash: {
                            batch: "command",
                            mentor: "mentors",
                            student: "attendance",
                            session: "sla",
                            ticket: "tickets",
                            task: "operations",
                            incident: "tech",
                            project: "ojt",
                            compliance: "compliance",
                            assessment: "assess",
                            dq: "dq",
                        }[t],
                        issue: `Follow-up required: ${t} ${label}`,
                        severity: "Medium",
                        owner: mePerson(),
                        due: DEMO + 5,
                        fn: "Academics",
                        link: [t, id],
                        status: "Open",
                    });
                    toast(`${ac.id} created and assigned to you`);
                    openD("action", ac.id);
                    render(true);
                },
                newAction: () =>
                    modal(
                        "New action",
                        `<div class="form"><label class="full">Issue<input class="inp" id="na-issue" placeholder="What needs to be fixed?"></label><label>Owner<select class="sel" id="na-owner">${ownerOptions(mePerson())}</select></label><label>Due date<input class="inp" type="date" id="na-due" value="${isoOf(DEMO + 7)}"></label><label>Severity<select class="sel" id="na-sev">${opt(["Critical", "High", "Medium", "Low"], "Medium")}</select></label><label>Originating dashboard<select class="sel" id="na-dash">${NAV.flatMap(
                            (g) => g.items
                        )
                            .map((i) => `<option value="${i[0]}">${esc(i[1])}</option>`)
                            .join(
                                ""
                            )}</select></label><label>Root cause<select class="sel" id="na-root">${opt(ROOTS)}</select></label><label>Function<select class="sel" id="na-fn">${opt(FUNCTIONS)}</select></label></div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="mkNewAction">Create action</button></div>`
                    ),
                mkNewAction: () => {
                    const issue = val("na-issue").trim();
                    if (!issue) {
                        toast("Describe the issue first");
                        return;
                    }
                    const ac = createAction({
                        dash: val("na-dash"),
                        issue,
                        owner: val("na-owner"),
                        due: readDate("na-due", DEMO + 7),
                        severity: val("na-sev"),
                        root: val("na-root"),
                        fn: val("na-fn"),
                    });
                    closeModal();
                    toast(ac.id + " created");
                    S.tab.actions = "all";
                    render(true);
                },
                saveAction: (a) => {
                    const o = REG.act[a],
                        note = val("ac-note"),
                        notes = o.notes.concat(note ? [{ t: DEMO, by: mePerson(), txt: note }] : []),
                        st = val("ac-status");
                    const f = {
                        owner: val("ac-owner"),
                        due: readDate("ac-due", o.due),
                        status: st,
                        severity: val("ac-sev"),
                        root: val("ac-root"),
                        evidence: val("ac-ev"),
                        fix: val("ac-fix"),
                        notes,
                    };
                    if (st === "Verified & closed") {
                        f.verify = "Verified";
                        f.closedOn = DEMO;
                    }
                    if (st.startsWith("Done")) f.verify = "Pending";
                    if (f.owner !== o.owner)
                        f.notes = f.notes.concat([{ t: DEMO, by: mePerson(), txt: "Reassigned to " + f.owner }]);
                    mutate("act", a, f);
                    toast("Action saved");
                    renderDrawer();
                    render(true);
                },
                escAction: (a) => {
                    const o = REG.act[a];
                    mutate("act", a, {
                        severity: "Critical",
                        escalated: true,
                        notes: o.notes.concat([{ t: DEMO, by: mePerson(), txt: "Escalated to Critical." }]),
                    });
                    toast("Action escalated");
                    renderDrawer();
                    render(true);
                },
                doneAction: (a) => {
                    const o = REG.act[a];
                    if (!o.evidence && !val("ac-ev")) {
                        toast("Add a resolution evidence reference first");
                        return;
                    }
                    mutate("act", a, {
                        status: "Done – awaiting verification",
                        verify: "Pending",
                        evidence: val("ac-ev") || o.evidence,
                        closedOn: DEMO,
                        notes: o.notes.concat([
                            { t: DEMO, by: mePerson(), txt: "Marked done; awaiting verification." },
                        ]),
                    });
                    toast("Marked done — now awaiting verification");
                    renderDrawer();
                    render(true);
                },
                verifyAction: (a) => {
                    const o = REG.act[a];
                    mutate("act", a, {
                        status: "Verified & closed",
                        verify: "Verified",
                        notes: o.notes.concat([{ t: DEMO, by: mePerson(), txt: "Verified and closed." }]),
                    });
                    toast("Action verified and closed");
                    renderDrawer();
                    render(true);
                },
                reopenAction: (a) => {
                    const o = REG.act[a];
                    mutate("act", a, {
                        status: "Reopened",
                        verify: "Rejected",
                        notes: o.notes.concat([{ t: DEMO, by: mePerson(), txt: "Reopened." }]),
                    });
                    toast("Action reopened");
                    renderDrawer();
                    render(true);
                },
            };
            const fnOfArea = (a) =>
                ({
                    "Class delivery": "Academics",
                    Attendance: "Student Affairs",
                    "Mentor SLA": "Academics",
                    Examinations: "Examinations",
                    "Student support": "Student Affairs",
                    OJT: "OJT Cell",
                    Technology: "IT & Platforms",
                    "University compliance": "University Liaison",
                    "Data quality": "IT & Platforms",
                    Operations: "Academics",
                })[a] || "Academics";
            const segSet = (k, v) => {
                S.tab["seg:" + k] = v;
            };
            function cfgChanged() {
                RISK = null;
                RISKKEY = "";
                _exc = null;
                saveMut();
                render(true);
            }
            const INS = {
                role: (v) => {
                    S.role = v;
                    render(true);
                },
                fsem: (v) => {
                    S.f.sem = v;
                    render(true);
                },
                frange: (v) => {
                    S.f.range = v;
                    if (v === "custom" && !S.f.from) {
                        S.f.from = isoOf(LAST - 27);
                        S.f.to = isoOf(LAST);
                    }
                    render(true);
                },
                ffrom: (v) => {
                    S.f.from = v;
                    render(true);
                },
                fto: (v) => {
                    S.f.to = v;
                    render(true);
                },
                fspec: (v) => {
                    S.f.spec = v;
                    render(true);
                },
                fbatch: (v) => {
                    S.f.batch = v;
                    render(true);
                },
                fmentor: (v) => {
                    S.f.mentor = v;
                    render(true);
                },
                trMetric: (v) => {
                    S.tab.trMetric = v;
                    S.tab.trBucket = null;
                    S.tab.trCell = null;
                    render(true);
                },
                attTarget: (v) => {
                    CFG.attTarget = clamp(+v || 85, 50, 100);
                    cfgChanged();
                },
                riskAtt: (v) => {
                    CFG.riskAtt = +v;
                    cfgChanged();
                },
                riskConsec: (v) => {
                    CFG.riskConsec = +v;
                    cfgChanged();
                },
                riskDrop: (v) => {
                    CFG.riskDrop = +v;
                    cfgChanged();
                },
                lateCountsAsPresent: (v) => {
                    CFG.lateCountsPresent = v === "1";
                    cfgChanged();
                },
                lateTol: (v) => {
                    CFG.lateTol = clamp(+v || 0, 0, 30);
                    cfgChanged();
                },
                exclApproved: (v) => {
                    CFG.excludeApprovedCancel = v === "1";
                    cfgChanged();
                },
                logall: (v, el) => {
                    segSet("logall", el.checked ? "all" : "exc");
                    render(true);
                },
                mentSel: (v) => {
                    S.tab.mentSel = v;
                    render(true);
                },
                opProc: (v) => {
                    S.tab.opProc = v;
                    render(true);
                },
                opGfn: (v) => {
                    S.tab.opGfn = v;
                    render(true);
                },
                techSys: (v) => {
                    S.tab.techSys = v;
                    render(true);
                },
                ojtType: (v) => {
                    S.tab.ojtType = v;
                    render(true);
                },
                calType: (v, el) => {
                    const h = S.tab.calHide || (S.tab.calHide = {});
                    if (el.checked) delete h[el.value];
                    else h[el.value] = 1;
                    render(true);
                },
            };
            document.addEventListener("click", (e) => {
                const a = e.target.closest("[data-act]");
                if (a && ACTS[a.dataset.act]) {
                    if (a.tagName === "INPUT" && a.type === "checkbox") {
                        return;
                    }
                    ACTS[a.dataset.act](a.dataset.arg, a, e);
                    return;
                }
                const th = e.target.closest("[data-sort]");
                if (th) {
                    const [id, i] = sp2(th.dataset.sort),
                        st = S.tbl[id];
                    st.dir = st.sort === +i && st.dir === "desc" ? "asc" : "desc";
                    if (st.sort !== +i) st.dir = TB[id].cols[+i].cls === "r" ? "desc" : "asc";
                    st.sort = +i;
                    st.page = 0;
                    refreshTable(id);
                    return;
                }
                const pg = e.target.closest("[data-pg]");
                if (pg) {
                    const [id, d] = sp2(pg.dataset.pg);
                    S.tbl[id].page += +d;
                    refreshTable(id);
                    return;
                }
                const row = e.target.closest("[data-row]");
                if (row) {
                    const [id, i] = sp2(row.dataset.row),
                        r = tableRows(id)[+i];
                    if (r && TB[id].open) {
                        const [t, k] = TB[id].open(r);
                        openD(t, k);
                    }
                    return;
                }
                if (S.notifOpen && !e.target.closest(".notif")) {
                    S.notifOpen = false;
                    renderNotif();
                }
                if (!e.target.closest(".searchbox")) $("#sres") && ($("#sres").hidden = true);
            });
            document.addEventListener("change", (e) => {
                const el = e.target;
                if (el.dataset.act === "toggleCheck") {
                    ACTS.toggleCheck(el.dataset.arg);
                    return;
                }
                if (el.dataset.tf) {
                    const [id, k] = sp2(el.dataset.tf);
                    S.tbl[id].f[k] = el.value;
                    S.tbl[id].page = 0;
                    refreshTable(id);
                    return;
                }
                if (el.dataset.in) {
                    const n = el.dataset.in;
                    if (n.startsWith("cfg:")) {
                        CFG[n.slice(4)] = +el.value;
                        cfgChanged();
                        renderDrawer();
                        return;
                    }
                    if (INS[n]) INS[n](el.value, el);
                }
            });
            document.addEventListener("input", (e) => {
                const el = e.target;
                if (el.dataset.tq) {
                    const st = S.tbl[el.dataset.tq];
                    st.q = el.value;
                    st.page = 0;
                    refreshTable(el.dataset.tq, `[data-tq="${el.dataset.tq}"]`);
                    return;
                }
                if (el.id === "gsearch") doSearch(el.value);
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if ($("#modal") && $("#modal").innerHTML) {
                        closeModal();
                        return;
                    }
                    if (S.dstack.length) closeDrawer();
                    if (S.notifOpen) {
                        S.notifOpen = false;
                        renderNotif();
                    }
                }
                if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[role=link]")) {
                    e.preventDefault();
                    e.target.click();
                }
            });
            $("#scrim").addEventListener("click", () => closeDrawer());
            window.addEventListener("resize", () => syncHeader());
            /* tabsBar records label for breadcrumbs */
            const _tabsBar = tabsBar;
            tabsBar = function (view, tabs, def) {
                const cur = S.tab[view] || def;
                const t = tabs.find((x) => x[0] === cur);
                window.__tab = { view, label: t ? t[1] : null };
                return _tabsBar(view, tabs, def);
            };

            /* ---------- boot ---------- */
            (function init() {
                try {
                    loadMut();
                    reindexActions();
                    const h = (location.hash || "").replace("#", "");
                    if (NAVMAP[h]) S.view = h;
                    renderHeader();
                    render(false);
                } catch (e) {
                    console.error(e);
                    $("#content").innerHTML =
                        `<div class="errbox"><b>The application failed to start.</b> ${esc(e.message)}</div>`;
                }
            })();
        </script>
    </body>
</html>
