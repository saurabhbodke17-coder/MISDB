            /* ============ VIEWS A: Command Center, Trends, Exceptions, Attendance, Class SLA ============ */
            const V = {};
            const lk = (type, id, label) =>
                `<span class="lk" role="link" tabindex="0" data-act="open" data-arg="${type}|${esc(id)}">${esc(label ?? id)}</span>`;
            const H = (title, desc, right = "") =>
                `<div class="ptitle"><div><h1>${title}</h1>${desc ? `<p>${desc}</p>` : ""}</div><div class="row">${right}</div></div>`;

                Object.assign({}, q, { from: Math.max(wkStart(w), T0), to: Math.min(wkStart(w) + 6, LAST) });
            const mondayOf = (d) => d - dow(d);
            function cmpSeries(key, q, gran = "weekly") {
                const tq = trendQ(q),
                    len = tq.to - tq.from + 1;
                const cur = series(key, tq, gran),
                    pq = Object.assign({}, tq, { from: tq.from - len, to: tq.from - 1 });
                const prev = pq.to >= T0 ? series(key, Object.assign(pq, { from: Math.max(T0, pq.from) }), gran) : [];

            function exRow(e, compact) {

   <div class="meta"><span>${sevPill(e.sev)}</span><span>${esc(e.area)} · ${esc(e.scope)}</span><span>Owner: ${esc(e.owner)}</span><span>Age ${e.age} d</span><span>Due ${fd(e.deadline)}</span></div>
   ${compact ? "" : `<div class="meta"><span class="ink2">Next: ${esc(e.next)}</span></div>`}</div>
   <div class="row" style="flex:none;flex-direction:column;align-items:flex-end;gap:4px">${a ? `<span class="pill ${a.status === "Verified & closed" ? "good" : a.status === "Blocked" ? "bad" : "acc"}">${esc(a.status)}</span>` : `<button class="btn sm pri" data-act="mkAction" data-arg="${esc(e.key)}">${ic("plus")} Create action</button>`}<button class="btn sm" data-act="open" data-arg="exception|${esc(e.key)}">Details</button></div></div>`;
            }
            function milestonesHTML(days = 7) {
                const q = Q();
                const list = EVENTS.filter(
                    (e) =>
                        e.d >= DEMO &&
                        e.d < DEMO + days &&
                        e.type !== "Mentor" &&
                        (!e.batches || e.batches.some((b) => q.batches.has(b)))
                ).sort((a, b) => a.d - b.d);
                const typeCol = {
                    Exam: "bad",
                    Holiday: "good",
                    Event: "acc",
                    University: "warn",
                    Submission: "warn",

                    return empty("No milestones in the next 7 days", "Change the batch filter to see more.");
                const byDay = {};
                list.forEach((e) => (byDay[e.d] = byDay[e.d] || []).push(e));

                    .map(
                        ([d, l]) =>
                            `<div class="ms"><div class="dt2">${fd(+d)}<small>${DOWN[dow(+d)]}${+d === DEMO ? " · today" : ""}</small></div><div style="flex:1;display:flex;flex-direction:column;gap:3px">${l.map((e) => `<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="pill ${typeCol[e.type] || ""}" style="min-width:74px;justify-content:center">${e.type}</span><span class="${e.ref ? "lk" : ""}" ${e.ref ? `data-act="openRef" data-arg="${esc(e.ref)}"` : ""}>${esc(e.title)}</span>${e.batches ? `<span class="muted">${e.batches.join(", ")}</span>` : ""}</div>`).join("")}</div></div>`
                    )
                    .join("");
            }
            /* ---------- 00 Command Center ---------- */
            V.command = () => {
                const q = Q(),
                    ks = kpiList(),
                    tq = trendQ(q),
                    wk = weeksOf(tq);
                const attMode = segv("cmdatt", "weekly");
                let attChart;
                if (attMode === "weekly") {
                    const c = cmpSeries("att", q);
                    attChart = lineChart({
                        labels: c.cur.map((x) => x.label.split(" · ")[0]),
                        tipLabels: c.cur.map((x) => x.label),
                        series: [
                            { name: "Attendance", vals: c.cur.map((x) => x.v), area: true },
                            {
                                name: "Previous period",
                                vals: c.cur.map((x, i) => (c.prev.length ? (c.prev[i]?.v ?? null) : null)),
                                dash: true,
                                color: "var(--ink3)",
                            },
                        ],
                        target: CFG.attTarget,
                        min: 60,
                        max: 100,
                        title: "Weekly attendance",
                    });
                } else {
                    const s = series("att", Object.assign({}, q, { from: Math.max(T0, q.to - 27) }), "daily");
                    attChart = lineChart({
                        labels: s.map((x) => x.label),
                        series: [{ name: "Attendance", vals: s.map((x) => x.v), area: true }],
                        target: CFG.attTarget,
                        min: 60,
                        max: 100,
                        title: "Daily attendance",
                        xMax: 10,
                    });
                }
                const ot = cmpSeries("ontime", q),
                    as = cmpSeries("assess", q),
                    sc = cmpSeries("score", q);
                const slaI = series("slaIssue", tq, "weekly");
                const issues = wk.map((w) => {
                    const a = wkStart(w),
                        b = Math.min(wkStart(w) + 6, LAST),
                        l = tktScope(q);
                    return {
                        c: l.filter((t) => t.created >= a && t.created < b + 1).length,
                        r: l.filter((t) => t.resolved != null && t.resolved >= a && t.resolved < b + 1).length,
                        o: l.filter((t) => tOpen(t, b + 1)).length,
                    };
                });
                const od = wk.map((w) => TASKS.filter((t) => tskOverdue(t, Math.min(wkStart(w) + 7, DEMO))).length);
                const batches = batchRows(q);
                const exs = EXC().slice(0, 7);
                return (
                    H(

                    })}</div>
    <div class="g g2">${card(
        "Daily absence count",

    ${card(
        `Sessions on ${fdy(selDay)} (${DOWN[dow(selDay)]})`,
        table("attsess", {
            cols: [
                { h: "Session", k: "id", f: (r) => lk("session", r.id) },

            function mentorSLA(mid, list) {
                const l = list.filter((s) => s.mentor === mid),
                    cs = classStats(l);
                const wks = new Set(
                    l.filter((s) => ["Late", "Missed", "Cancelled (unplanned)"].includes(sst(s))).map((s) => wkOf(s.d))
                );
                return { id: mid, name: MENTOR[mid].name, cs, bw: wks.size, repeat: wks.size >= 3 && cs.breach >= 3 };

            /* ============ VIEWS B: Academics, Mentors, Operations, Data quality, Technology ============ */
            const ASC = [
                "Completed",
                "Submitted late",
                "Missing",
                "Absent",
                "Awaiting evaluation",
                "Late · awaiting evaluation",
                "Not enrolled",
            ];
            function studentAssess(s) {
                const out = [];
                ASSESS.forEach((a) => {
                    if (a.batch !== s.batch || !a.st) return;
                    const c = a.st[s.idx];
                    if (c === 6) return;
                    out.push({ a, code: c, mark: a.mk[s.idx] });
                });
                return out.sort((x, y) => x.a.due - y.a.due);
            }
            const stuAvg = (s) => {
                const m = studentAssess(s)
                    .filter((x) => x.mark >= 0)
                    .map((x) => x.mark);
                return m.length ? avg(m) : null;
            };
            const RISKCOL = { High: "var(--bad)", Medium: "var(--c3)", None: "var(--c2)" };
            /* ---------- 05 Academic performance ---------- */
            V.academic = () => {
                const q = Q(),
                    cur = curTab("academic", "overview"),
                    A = assessStats(q),
                    rm = riskMap();
                const studs = studentsIn(q);
                const flagged = studs.filter((s) => rm[s.id] && rm[s.id].level !== "None");
                const backlog = ASSESS.filter(
                    (a) => a.st && q.batches.has(a.batch) && a.due <= LAST && a.evalPct != null && a.evalPct < 1
                );
                const overdueB = backlog.filter((a) => a.overdueEval && a.evalPct < 0.9);
                const tabs = tabsBar(
                    "academic",
                    [
                        ["overview", "Overview"],
                        ["subjects", "Subjects & batches"],
                        ["risk", "Students requiring intervention"],
                        ["backlog", "Assessment backlog"],
                    ],
                    "overview"
                );
                const metrics = metricRow([
                    { label: "Average marks", v: pct(A.avg), sub: `Median ${pct(A.median)}`, info: MET.score.def },
                    {
                        label: "Pass percentage",
                        v: pct(A.pass),
                        sub: `Pass mark ${CFG.passMark}%`,
                        tone: A.pass >= 85 ? "good" : A.pass >= 75 ? "warn" : "bad",
                    },
                    {
                        label: "Assessment completion",
                        v: pct(A.rate),
                        sub: `${fint(A.comp)} of ${fint(A.due)} due`,
                        tone: A.rate >= CFG.assessTarget ? "good" : "warn",
                        info: MET.assess.def,
                    },
                    {
                        label: "Awaiting evaluation",
                        v: fint(A.pend),
                        sub: `${overdueB.length} assessments past deadline`,
                        tone: overdueB.length ? "bad" : "good",
                        act: "acadtab",
                        arg: "backlog",
                    },
                    {
                        label: "Students requiring intervention",
                        v: fint(flagged.length),
                        sub: `${pct(studs.length ? (flagged.length / studs.length) * 100 : null, 0)} of students`,
                        tone: flagged.length / Math.max(1, studs.length) > 0.14 ? "bad" : "warn",
                        act: "acadtab",
                        arg: "risk",
                    },
                ]);
                let body = "";
                if (cur === "overview") {
                    const bins = [...Array(10).keys()].map(
                        (i) => A.marks.filter((m) => m >= i * 10 && (i === 9 ? m <= 100 : m < i * 10 + 10)).length
                    );
                    const sem = [1, 3, 5, 7].map((s) => {
                        const a = assessStats(
                            Object.assign({}, q, {
                                from: T0,
                                to: LAST,
                                batches: new Set(
                                    BATCHES.filter((b) => b.sem === s && q.batches.has(b.id)).map((b) => b.id)
                                ),
                            })
                        );
                        return { s, avg: a.avg, pass: a.pass };
                    });
                    const wk = cmpSeries("score", q);
                    const pts = studs
                        .filter((s) => riskOf(s.id).att != null)
                        .map((s) => ({
                            x: +riskOf(s.id).att.toFixed(1),
                            y: +(stuAvg(s) ?? 0).toFixed(1),
                            color: RISKCOL[riskOf(s.id).level],
                            r: riskOf(s.id).level === "High" ? 5 : 3.6,
                            tip: `<b>${s.id}</b> · ${s.batch}\nAttendance ${pct(riskOf(s.id).att, 0)} · Avg score ${pct(stuAvg(s), 0)}\n${
                                riskOf(s.id)
                                    .reasons.map((r) => r.t)
                                    .join("\n") || "No risk flags"
                            }`,
                            act: "open",
                            arg: "student|" + s.id,
                        }))
                        .filter((p) => p.y > 0);
                    body = `<div class="g g2" style="margin-bottom:12px">${card("Score distribution", barChart({ labels: bins.map((_, i) => `${i * 10}–${i === 9 ? 100 : i * 10 + 9}`), series: [{ name: "Evaluated assessments", vals: bins, colors: bins.map((_, i) => (i < 4 ? "var(--bad)" : "var(--c1)")), color: "var(--c1)" }], h: 220, title: "Score distribution" }), { sub: `${fint(A.marks.length)} evaluated student assessments · red bars are below the pass mark` })}
    ${card(
        "Semester performance trend",
        lineChart({
            labels: wk.cur.map((x) => x.label.split(" · ")[0]),
            tipLabels: wk.cur.map((x) => x.label),
            series: [
                { name: "Average score", vals: wk.cur.map((x) => x.v), area: true },
                {
                    name: "Previous period",
                    vals: wk.cur.map((x, i) => wk.prev[i]?.v ?? null),
                    dash: true,
                    color: "var(--ink3)",
                },
            ],
            min: 30,
            max: 90,
            target: 65,
            targetLabel: "Benchmark 65%",
            title: "Semester performance",

    )}</div>
    <div class="g g2" style="margin-bottom:12px">${card(
        "Attendance vs performance",
        scatter({
            pts,

                    body = `<div class="g gmain">${card("Subject-wise performance heatmap", heatmap({ cols: bs.map((b) => b.id), rows: rowsH, lw: 210, cw: 62 }), { sub: "Average score (%) for the full term to date; blank = subject not taught to that batch" })}
    ${card(
        "Subject summary",
        table("acsub", {
            cols: [

                { h: "Avg", k: "a", cls: "r", v: (r) => r.a.avg ?? -1, f: (r) => pct(r.a.avg, 0) },

        })
    )}</div>`;
                } else if (cur === "risk") {
                    const spark2 = (s) =>
                        spark(
                            studentAssess(s)

                    body = card(
                        "Students requiring intervention",
                        table("acrisk", {
                            cols: [
                                {
                                    h: "Student",
                                    k: "id",

                                        lk("student", r.id) +
                                        `<div class="muted" style="font-size:11px">${esc(r.name)} · ${r.batch}</div>`,
                                    v: (r) => r.id,
                                },
                                {
                                    h: "Risk",

                                    v: (r) => ({ High: 0, Medium: 1 })[rm[r.id].level],

                                {

                                    cls: "r",
                                    v: (r) => rm[r.id].att ?? 0,
                                    f: (r) => pct(rm[r.id].att, 0),
                                },
                                {
                                    h: "Avg score",
                                    k: "s",
                                    cls: "r",
                                    v: (r) => stuAvg(r) ?? 0,
                                    f: (r) => pct(stuAvg(r), 0),
                                },
                                { h: "Fails", k: "f", cls: "r", v: (r) => rm[r.id].fails, f: (r) => rm[r.id].fails },
                                { h: "Missing", k: "m", cls: "r", v: (r) => rm[r.id].miss, f: (r) => rm[r.id].miss },
                                {
                                    h: "Trajectory",
                                    k: "t",
                                    f: (r) => `<div style="width:86px">${spark2(r)}</div>`,
                                    v: (r) => stuAvg(r) ?? 0,
                                    csv: (r) =>
                                        studentAssess(r)
                                            .filter((x) => x.mark >= 0)
                                            .map((x) => x.mark)
                                            .join("/"),
                                },
                            ],
                            rows: flagged,
                            open: (r) => ["student", r.id],
                            csv: "at-risk-students",
                            pageSize: 12,
                            sort: 1,
                            dir: "asc",
                            filters: [
                                { k: "b", label: "Batch", get: (r) => r.batch },
                                { k: "l", label: "Level", get: (r) => rm[r.id].level },
                            ],
                            search: (r) =>
                                r.id + " " + r.name + " " + r.batch + " " + rm[r.id].reasons.map((x) => x.t).join(" "),
                        }),
                        { sub: "Every flag lists the rule that triggered it; there is no opaque predictive score." }
                    );
                } else {
                    body = card(
                        "Assessment backlog",
                        table("acback", {
                            cols: [
                                { h: "Assessment", k: "id", f: (r) => lk("assessment", r.id) },
                                {
                                    h: "Course",
                                    k: "c",
                                    f: (r) => COURSE[r.course].name,
                                    v: (r) => COURSE[r.course].name,
                                },
                                { h: "Name", k: "name" },
                                { h: "Batch", k: "batch" },
                                { h: "Due", k: "due", f: (r) => fd(r.due) },
                                { h: "Eval. deadline", k: "evalDue", f: (r) => fd(r.evalDue) },
                                {
                                    h: "Evaluated",
                                    k: "e",
                                    cls: "r",
                                    v: (r) => r.evalPct,
                                    f: (r) =>
                                        `<div class="row" style="flex-wrap:nowrap"><div class="bar ${r.evalPct < 0.5 ? "bad" : r.evalPct < 0.9 ? "warn" : "good"}" style="width:60px"><i style="width:${r.evalPct * 100}%"></i></div>${Math.round(r.evalPct * 100)}%</div>`,
                                },
                                {
                                    h: "Papers pending",
                                    k: "p",
                                    cls: "r",
                                    v: (r) => r.sub - r.evald,
                                    f: (r) => r.sub - r.evald,
                                },
                                {
                                    h: "Days overdue",
                                    k: "o",
                                    cls: "r",
                                    v: (r) => Math.max(0, DEMO - r.evalDue),
                                    f: (r) => (r.evalDue < DEMO ? `<b class="bad">${DEMO - r.evalDue}</b>` : "—"),
                                },
                                {
                                    h: "Evaluator",
                                    k: "m",
                                    f: (r) => MENTOR[r.mentor].name,
                                    v: (r) => MENTOR[r.mentor].name,
                                },
                            ],
                            rows: backlog,
                            open: (r) => ["assessment", r.id],
                            csv: "assessment-backlog",
                            pageSize: 12,
                            sort: 9,
                            dir: "desc",
                        }),
                        { sub: "Assessments with papers still awaiting evaluation" }
                    );
                }
                return (
                    H(
                        "Student Academic Performance",
                        "Marks, pass rates, completion and transparent student risk rules."
                    ) +
                    metrics +
                    tabs +
                    body
                );
            };

            /* ---------- 06 Mentor performance ---------- */
            const FBMEAN = avg(MFB.map((f) => f.score));
            function mentorCard(mid, q) {
                const list = sessIn(Object.assign({}, q, { mentor: mid, batches: new Set(BATCHES.map((b) => b.id)) }));
                const cs = classStats(list),
                    ms = mentorSLA(mid, list);
                const as = ASSESS.filter((a) => a.mentor === mid && a.st && a.due <= LAST),
                    sub = sum(as.map((a) => a.sub)),
                    ev = sum(as.map((a) => a.evald));
                const fb = MFB.filter((f) => f.mentor === mid && wkStart(f.w) + 6 >= q.from && wkStart(f.w) <= q.to),
                    n = fb.length,
                    mean = n ? avg(fb.map((f) => f.score)) : null;
                const adj = n ? (n * mean + 10 * FBMEAN) / (n + 10) : null;
                const mt = MTASKS.filter((t) => t.mentor === mid),
                    fu = mt.filter((t) => t.type === "Student follow-up" && t.due <= DEMO),
                    fuDone = fu.filter((t) => t.done).length;
                const pend = mt.filter((t) => !t.done && t.due <= DEMO + 7).length;
                const bs = [...new Set(PAIRS.filter((p) => p.mentor === mid).map((p) => p.batch))];
                return {
                    id: mid,
                    name: MENTOR[mid].name,
                    cs,
                    ms,
                    evalRate: sub ? (ev / sub) * 100 : null,
                    fbn: n,
                    fb: mean,
                    adj,
                    fu: fu.length ? (fuDone / fu.length) * 100 : null,
                    pend,
                    repeat: ms.repeat,
                    batches: bs,
                    courses: PAIRS.filter((p) => p.mentor === mid),
                };
            }
            V.mentors = () => {
                const q = Q(),
                    cur = curTab("mentors", "score");
                let ids = MENTORS.map((m) => m.id)
                    .filter((id) => !q.mentor || id === q.mentor)
                    .filter((id) => PAIRS.some((p) => p.mentor === id && q.batches.has(p.batch)));
                const cards = ids.map((id) => mentorCard(id, q));
                const sel =
                    S.tab.mentSel && ids.includes(S.tab.mentSel)
                        ? S.tab.mentSel
                        : ids.includes(LATE_M)
                          ? LATE_M
                          : ids[0];
                const tabs = tabsBar(
                    "mentors",
                    [
                        ["score", "Scorecard"],
                        ["trend", "Weekly trend"],
                        ["workload", "Workload"],
                        ["feedback", "Feedback"],
                        ["exceptions", "Exception log"],
                    ],
                    "score"
                );
                const ot = avg(cards.filter((c) => c.cs.ontime != null).map((c) => c.cs.ontime)),
                    fbAll = avg(cards.filter((c) => c.fb != null).map((c) => c.fb));
                const metrics = metricRow([
                    {
                        label: "Mentors in view",
                        v: fint(cards.length),
                        sub: `${fint(sum(cards.map((c) => c.cs.total)))} classes assigned`,
                    },
                    { label: "Avg on-time delivery", v: pct(ot), tone: ot >= CFG.ontimeTarget - 3 ? "good" : "warn" },
                    {
                        label: "Avg evaluation completion",
                        v: pct(avg(cards.filter((c) => c.evalRate != null).map((c) => c.evalRate))),
                        tone: "good",
                    },
                    {
                        label: "Avg student feedback",
                        v: fnum(fbAll, 2),
                        u: "/ 5",
                        sub: `${fint(sum(cards.map((c) => c.fbn)))} responses`,
                    },
                    {
                        label: "Mentors with repeat SLA breaches",
                        v: fint(cards.filter((c) => c.repeat).length),
                        tone: cards.some((c) => c.repeat) ? "bad" : "good",

                let body = "";
                const selector = `<select class="sel" data-in="mentSel" aria-label="Mentor">${ids.map((id) => `<option value="${id}" ${id === sel ? "selected" : ""}>${esc(MENTOR[id].name)}</option>`).join("")}</select>`;

                        total: t.length,

                if (cur === "planned") {
                    const rows = PROCESSES.map(procRow);
                    body = `<div class="g gmain">${card(

                    body =

                return (

            };
            function taskTable(id, rows) {

                    const items = [];
                    UCOMP.filter((u) => u.stage < 2 && u.due >= DEMO - 7 && u.due <= DEMO + 21).forEach((u) =>
                        items.push({
                            kind: "University",
                            t: u.title,
                            due: u.due,
                            ready: u.ready,
                            owner: u.owner,
                            ref: ["compliance", u.id],
                        })
                    );
                    TASKS.filter(
                        (t) =>
                            t.status !== "Completed" &&
                            t.due >= DEMO - 7 &&
                            t.due <= DEMO + 21 &&
                            ["UNS", "QPR", "QPE", "EXE", "MRK"].includes(t.proc)
                    ).forEach((t) =>
                        items.push({
                            kind: "Task",
                            t: `${t.pname}: ${t.title}`,
                            due: t.due,
                            ready: t.progress,
                            owner: t.owner,
                            ref: ["task", t.id],
                        })
                    );
                    ASSESS.filter((a) => a.type === "End-Sem" && q.batches.has(a.batch)).forEach((a) => {
                        const r = Math.round((a.check.filter((c) => c.done).length / a.check.length) * 100);
                        items.push({
                            kind: "Exam readiness",
                            t: `End-Sem ${COURSE[a.course].name} · ${a.batch}`,
                            due: a.due,
                            ready: r,
                            owner: STAFF.exam,
                            ref: ["assessment", a.id],
                        });
                    });
                    OJT.filter((p) => q.batches.has(p.batch)).forEach((p) =>
                        p.delayed.forEach((m) =>
                            items.push({
                                kind: "OJT",
                                t: `${p.id} ${m.n}`,
                                due: m.plan,
                                ready: p.pct,
                                owner: STAFF.ojt,
                                ref: ["project", p.id],
                            })
                        )
                    );
                    const risk = (i) => {
                        const dl = i.due - DEMO;
                        return dl < 0
                            ? "Overdue"
                            : dl <= 7 && i.ready < 80
                              ? "At risk"
                              : dl <= 14 && i.ready < 50
                                ? "At risk"
                                : "On track";
                    };
                    items.forEach((i) => (i.risk = risk(i)));
                    body = card(
                        "Upcoming deadline risk",
                        table("dlr", {
                            cols: [
                                { h: "Type", k: "kind" },
                                { h: "Deadline item", k: "t", wrap: true, f: (r) => esc(r.t) },
                                {
                                    h: "Due",
                                    k: "due",
                                    f: (r) =>
                                        fd(r.due) +
                                        ` <span class="muted">(${r.due - DEMO < 0 ? Math.abs(r.due - DEMO) + " d late" : r.due === DEMO ? "today" : "in " + (r.due - DEMO) + " d"})</span>`,
                                },
                                {
                                    h: "Readiness",
                                    k: "ready",
                                    cls: "r",
                                    f: (r) =>
                                        `<div class="row" style="flex-wrap:nowrap"><div class="bar ${r.ready >= 80 ? "good" : r.ready >= 50 ? "warn" : "bad"}" style="width:60px"><i style="width:${r.ready}%"></i></div>${r.ready}%</div>`,
                                },
                                { h: "Owner", k: "owner" },
                                {
                                    h: "Risk",
                                    k: "risk",
                                    f: (r) =>
                                        `<span class="pill ${r.risk === "On track" ? "good" : r.risk === "At risk" ? "warn" : "bad"}">${r.risk}</span>`,
                                    v: (r) => ({ Overdue: 0, "At risk": 1, "On track": 2 })[r.risk],
                                },
                            ],
                            rows: items,
                            open: (r) => r.ref,
                            csv: "deadline-risk",
                            pageSize: 12,
                            sort: 5,
                            dir: "asc",
                            filters: [
                                { k: "kind", label: "Type", get: (r) => r.kind },
                                { k: "risk", label: "Risk", get: (r) => r.risk },
                            ],
                        }),
                        {
                            sub: "Risk = deadline within 7 days and under 80% ready, within 14 days and under 50% ready, or already overdue.",
                        }
                    );
                }
                return (
                    H(
                        "Academic Calendar & Scheduling",
                        "One calendar for timetable, exams, holidays, events, OJT reviews, university deadlines and submissions, with conflict and disruption analysis."
                    ) +
                    metrics +
                    tabs +
                    body
                );
            };

            /* ---------- 13 Assessments & Examinations ---------- */
            const STAGES = [
                "Scheduled",
                "Paper preparation",
                "Paper review",
                "Platform ready",
                "Evaluation",
                "Marks entry",
                "Marks verification",
                "Result published",
            ];
            V.assess = () => {
                const q = Q(),
                    cur = curTab("assess", "lifecycle");
                const list = ASSESS.filter((a) => q.batches.has(a.batch) && (!q.mentor || a.mentor === q.mentor));
                const tabs = tabsBar(
                    "assess",
                    [
                        ["lifecycle", "Lifecycle"],
                        ["readiness", "Readiness checklist"],
                        ["matrix", "Semester progress"],
                        ["overdue", "Overdue evaluations"],
                        ["timeline", "Publication timeline"],
                        ["improve", "Improvement & corrections"],
                    ],
                    "lifecycle"
                );
                const overdue = list.filter((a) => a.overdueEval && a.evalPct < 0.9),
                    published = list.filter((a) => a.stage === "Result published"),
                    conducted = list.filter((a) => a.due <= LAST);
                const es = list.filter((a) => a.type === "End-Sem"),
                    ready = es.filter((a) => a.check.every((c) => c.done)).length;
                const metrics = metricRow([
                    {
                        label: "Assessments tracked",
                        v: list.length,
                        sub: `${conducted.length} conducted · ${list.length - conducted.length} upcoming`,
                    },
                    {
                        label: "Results published",
                        v: published.length,
                        sub:
                            pct(conducted.length ? (published.length / conducted.length) * 100 : null, 0) +
                            " of conducted",
                    },
                    {
                        label: "Evaluation overdue",
                        v: overdue.length,
                        tone: overdue.length ? "bad" : "good",
                        act: "asstab",
                        arg: "overdue",
                    },
                    { label: "In evaluation", v: list.filter((a) => a.stage === "Evaluation").length, tone: "warn" },
                    {
                        label: "End-Sem papers ready",
                        v: `${ready}/${es.length}`,
                        sub: "All checklist items done",
                        tone: ready / Math.max(1, es.length) > 0.5 ? "good" : "warn",
                        act: "asstab",
                        arg: "readiness",
                    },
                ]);
                let body = "";
                if (cur === "lifecycle") {
                    const cnt = STAGES.map((s) => ({
                        label: s,
                        v: list.filter((a) => a.stage === s).length,
                        arg: s,
                        act: "asstage",
                    }));
                    const sel = S.tab.asStage;
                    body = `<div class="g g2" style="margin-bottom:12px">${card(
                        "Assessments by lifecycle stage",
                        funnel(
                            cnt
                                .map((c, i) => ({
                                    label: c.label,
                                    v: c.v,
                                    color: i >= 4 && i < 7 ? "var(--c3)" : "var(--c1)",
                                    act: "asstage",
                                    arg: c.arg,
                                }))
                                .map((r) => Object.assign(r, { v: r.v || 0 }))
                                .filter((r) => true)
                                .map((r) => Object.assign({}, r, { v: Math.max(r.v, 0) })) || "",
                            { lw: 150 }
                        ),
                        {
                            sub: "Schedule → paper preparation → review → platform readiness → evaluation → marks entry → verification → publication. Click a stage to list its assessments.",
                        }
                    )}
    ${card(
        "Evaluation progress",
        hbars(
            list
                .filter((a) => a.st && a.due >= DEMO - 35)
                .sort((a, b) => a.evalPct - b.evalPct)
                .slice(0, 10)
                .map((a) => ({
                    label: `${a.batch} ${COURSE[a.course].name.slice(0, 16)} ${a.name}`,
                    v: a.evalPct * 100,
                    vt: Math.round(a.evalPct * 100) + "%",
                    tone: a.evalPct < 0.5 ? "bad" : a.evalPct < 0.9 ? "warn" : "good",
                    act: "open",
                    arg: "assessment|" + a.id,
                })),
            { max: 100, lw: 250, vw: 46 }
        ),
        { sub: "Least-evaluated recent assessments" }
    )}</div>
    ${card(
        "Assessments" +
            (sel ? ` · ${esc(sel)} <button class="btn sm" data-act="asstage" data-arg="">Clear</button>` : ""),
        assessTable(
            "asl",
            list.filter((a) => !sel || a.stage === sel)
        )
    )}`;
                } else if (cur === "readiness") {
                    body = card(
                        "End-Semester readiness checklist",
                        table("asr", {
                            cols: [
                                { h: "Assessment", k: "id", f: (r) => lk("assessment", r.id) },
                                {
                                    h: "Course",
                                    k: "c",
                                    f: (r) => COURSE[r.course].name,
                                    v: (r) => COURSE[r.course].name,
                                },
                                { h: "Batch", k: "batch" },
                                { h: "Exam date", k: "due", f: (r) => fd(r.due) },
                                ...Array.from({ length: 8 }, (_, i) => ({
                                    h: [
                                        "Setters",
                                        "Draft",
                                        "Moderation",
                                        "Univ. approval",
                                        "Dry run",
                                        "Hall tickets",
                                        "Invigilation",
                                        "Accessibility",
                                    ][i],
                                    k: "c" + i,
                                    cls: "r",
                                    v: (r) => (r.check[i].done ? 1 : 0),
                                    f: (r) =>
                                        r.check[i].done
                                            ? '<span class="good" title="Done">✔</span>'
                                            : r.check[i].late
                                              ? `<span class="bad" ${tipAttr("Overdue since " + fd(r.check[i].due))}>✖</span>`
                                              : `<span class="muted" ${tipAttr("Due " + fd(r.check[i].due))}>○</span>`,
                                })),
                                {
                                    h: "Ready",
                                    k: "rd",
                                    cls: "r",
                                    v: (r) => r.check.filter((c) => c.done).length,
                                    f: (r) => `<b>${Math.round((r.check.filter((c) => c.done).length / 8) * 100)}%</b>`,
                                },
                            ],
                            rows: es,
                            open: (r) => ["assessment", r.id],
                            csv: "readiness",
                            pageSize: 12,
                            sort: 13,
                            dir: "asc",
                            filters: [{ k: "b", label: "Batch", get: (r) => r.batch }],
                        }),
                        { sub: "✔ done · ✖ overdue · ○ pending. Open an assessment to tick items off." }
                    );
                } else if (cur === "matrix") {
                    const names = ["Quiz 1", "Assignment 1", "Mid-Term", "Quiz 2", "End-Sem"];
                    body = card(
                        "Semester-wise progress matrix",
                        heatmap({
                            cols: names,
                            rows: [1, 3, 5, 7]
                                .filter((s) => list.some((a) => BATCH[a.batch].sem === s))
                                .map((s) => ({
                                    label: "Semester " + s,
                                    cells: names.map((n) => {
                                        const l = list.filter((a) => BATCH[a.batch].sem === s && a.name === n);
                                        if (!l.length) return { text: "", color: "transparent" };
                                        const idx = avg(l.map((a) => STAGES.indexOf(a.stage)));
                                        const done = l.filter((a) => a.stage === "Result published").length;
                                        return {
                                            text: `${done}/${l.length}`,
                                            color: heatRag(idx / 7),
                                            tip: `Semester ${s} · ${n}\n${done} of ${l.length} published\nMost common stage: ${l.map((a) => a.stage).sort((a, b) => l.filter((x) => x.stage === b).length - l.filter((x) => x.stage === a).length)[0]}`,
                                            act: "asstage",
                                            arg: l[0].stage,
                                        };
                                    }),
                                })),
                            lw: 110,
                            cw: 96,
                        }),
                        {
                            sub: "Cell = results published ÷ assessments in that semester. Colour shows average lifecycle progress.",
                        }
                    );
                } else if (cur === "overdue") {
                    body = card(
                        "Overdue evaluations",
                        assessTable(
                            "aso",
                            list.filter((a) => a.overdueEval)
                        ),
                        { sub: "Past the evaluation deadline with papers still pending" }
                    );
                } else if (cur === "timeline") {
                    const days = [];
                    for (let d = T0 + 10; d <= LAST; d += 3) days.push(d);
                    body = `<div class="g g2">${card(
                        "Cumulative assessments conducted vs published",
                        lineChart({
                            labels: days.map(fd),
                            series: [
                                {
                                    name: "Conducted",
                                    vals: days.map((d) => list.filter((a) => a.due <= d).length),
                                    color: "var(--c1)",
                                },
                                {
                                    name: "Results published",
                                    vals: days.map((d) => list.filter((a) => a.published && a.published <= d).length),
                                    color: "var(--good)",
                                    area: true,
                                },
                            ],
                            unit: "",
                            fmt: (v) => fint(v),
                            min: 0,
                            xMax: 10,
                            title: "Publication timeline",
                        }),
                        { sub: "The gap between the lines is results still to be published" }
                    )}
    ${card(
        "Recent publications",
        table("aspub", {
            cols: [
                { h: "Assessment", k: "id", f: (r) => lk("assessment", r.id) },
                { h: "Course", k: "c", f: (r) => COURSE[r.course].name, v: (r) => COURSE[r.course].name },
                { h: "Batch", k: "batch" },
                { h: "Exam", k: "due", f: (r) => fd(r.due) },
                { h: "Published", k: "published", f: (r) => (r.published ? fd(r.published) : "—") },
                {
                    h: "Turnaround",
                    k: "t",
                    cls: "r",
                    v: (r) => (r.published ? r.published - r.due : -1),
                    f: (r) => (r.published ? r.published - r.due + " d" : "—"),
                },
            ],
            rows: list.filter((a) => a.published),
            open: (r) => ["assessment", r.id],
            pageSize: 8,
            sort: 4,
            dir: "desc",
        })
    )}</div>`;
                } else {
                    const fails = [];
                    list.filter((a) => a.type === "Mid-Term" && a.st).forEach((a) => {
                        BSTU[a.batch].forEach((s, i) => {
                            if (a.mk[i] >= 0 && a.mk[i] < CFG.passMark) fails.push({ s, a, m: a.mk[i] });
                        });
                    });
                    const imp = fails
                        .filter((_, i) => i % 2 === 0)
                        .map((f, i) =>
                            Object.assign(f, {
                                st: ["Registered", "Scheduled", "Completed"][i % 3],
                                date: DEMO + 3 + (i % 9),
                            })
                        );
                    const corr = DQLOG.filter(
                        (d) => d.cat === "Marks discrepancy" && d.status !== "Verified" && q.batches.has(d.batch)
                    );
                    body = `<div class="g g2">${card(
                        "Improvement examinations",
                        table("asimp", {
                            cols: [
                                { h: "Student", k: "s", f: (r) => lk("student", r.s.id), v: (r) => r.s.id },
                                { h: "Batch", k: "b", f: (r) => r.s.batch },
                                {
                                    h: "Course",
                                    k: "c",
                                    f: (r) => COURSE[r.a.course].name,
                                    v: (r) => COURSE[r.a.course].name,
                                },
                                { h: "Mid-term", k: "m", cls: "r", f: (r) => r.m + "%" },
                                { h: "Exam date", k: "date", f: (r) => fd(r.date) },
                                {
                                    h: "Status",
                                    k: "st",
                                    f: (r) =>
                                        statusPill(
                                            r.st === "Registered"
                                                ? "In progress"
                                                : r.st === "Scheduled"
                                                  ? "Open"
                                                  : "Completed"
                                        ).replace(/In progress|Open/, r.st),
                                },
                            ],
                            rows: imp,
                            pageSize: 8,
                            csv: "improvement-exams",
                        }),
                        { sub: "Students below the pass mark in a mid-term who registered for improvement" }
                    )}
    ${card(
        "Pending marks corrections",
        table("ascorr", {
            cols: [
                { h: "ID", k: "id", f: (r) => lk("dq", r.id) },
                { h: "Record", k: "rec" },
                { h: "Source", k: "src" },
                {
                    h: "Status",
                    k: "status",
                    f: (r) =>
                        statusPill(r.status === "Corrected – awaiting verification" ? "On hold" : r.status).replace(
                            "On hold",
                            "Awaiting verification"
                        ),
                },
                { h: "Open for", k: "det", cls: "r", v: (r) => r.det, f: (r) => LAST - r.det + 1 + " d" },
                { h: "Owner", k: "owner" },
            ],
            rows: corr,
            open: (r) => ["dq", r.id],
            pageSize: 8,
            sort: 4,
            dir: "asc",
            csv: "marks-corrections",
        }),
        { sub: "Marks discrepancies not yet verified" }
    )}</div>`;
                }
                return (
                    H(
                        "Assessments & Examinations",
                        "The full assessment lifecycle from schedule to result publication."
                    ) +
                    metrics +
                    tabs +
                    body
                );
            };
            function assessTable(id, rows) {
                return table(id, {
                    cols: [
                        { h: "Assessment", k: "id", f: (r) => lk("assessment", r.id) },
                        { h: "Course", k: "c", f: (r) => COURSE[r.course].name, v: (r) => COURSE[r.course].name },
                        { h: "Type", k: "name" },
                        { h: "Batch", k: "batch" },
                        { h: "Date", k: "due", f: (r) => fd(r.due) },
                        {
                            h: "Stage",
                            k: "stage",
                            f: (r) =>
                                `<span class="pill ${r.overdueEval && r.evalPct < 0.9 ? "bad" : r.stage === "Result published" ? "good" : "acc"}">${r.stage}</span>`,
                            v: (r) => STAGES.indexOf(r.stage),
                        },
                        {
                            h: "Evaluated",
                            k: "e",
                            cls: "r",
                            v: (r) => r.evalPct ?? -1,
                            f: (r) => (r.evalPct == null ? "—" : Math.round(r.evalPct * 100) + "%"),
                        },
                        { h: "Evaluator", k: "m", f: (r) => MENTOR[r.mentor].name, v: (r) => MENTOR[r.mentor].name },
                    ],
                    rows,
                    open: (r) => ["assessment", r.id],
                    csv: id,
                    pageSize: 10,
                    sort: 4,
                    dir: "desc",
                    filters: [
                        { k: "b", label: "Batch", get: (r) => r.batch },
                        { k: "n", label: "Type", get: (r) => r.name },
                    ],
                    search: (r) => [r.id, COURSE[r.course].name, r.batch, r.name, MENTOR[r.mentor].name].join(" "),
                });
            }

            /* ---------- 14 University Compliance ---------- */
            V.compliance = () => {
                const q = Q(),
                    cur = curTab("compliance", "tracker"),
                    L = UCOMP;
                const subm = L.filter((u) => u.stage >= 2),
                    pend = L.filter((u) => u.stage === 2 || u.stage === 3),
                    over = L.filter((u) => u.overdue),
                    risk = L.filter((u) => compRisk(u, DEMO));
                const dueSoFar = L.filter((u) => u.due <= DEMO + 7);
                const rate = dueSoFar.length
                    ? (dueSoFar.filter((u) => u.stage >= 2).length / dueSoFar.length) * 100
                    : null;
                const tabs = tabsBar(
                    "compliance",
                    [
                        ["tracker", "Tracker"],
                        ["calendar", "Compliance calendar"],
                        ["breach", "Deadline breach log"],
                        ["funnel", "Submission funnel"],
                    ],
                    "tracker"
                );
                const metrics = metricRow([
                    { label: "Milestones tracked", v: L.length, sub: `${UCAT.length} categories` },
                    {
                        label: "Submission completion",
                        v: pct(rate, 0),
                        sub: `Of items due within 7 days`,
                        tone: rate >= 85 ? "good" : "warn",
                    },
                    {
                        label: "Pending approvals",
                        v: pend.length,
                        tone: "warn",
                        sub: `${L.filter((u) => u.query).length} with open queries`,
                    },
                    { label: "Overdue submissions", v: over.length, tone: over.length ? "bad" : "good" },
                    { label: "At risk (≤ 10 days)", v: risk.length, tone: risk.length > 3 ? "bad" : "warn" },
                    {
                        label: "Reconciliation discrepancies",
                        v: sum(L.filter((u) => u.stage < 4).map((u) => u.disc)),
                        tone: "warn",
                    },
                ]);
                let body = "";
                const stageName = (u) => UST[u.stage];
                if (cur === "tracker")
                    body = card(
                        "University compliance tracker",
                        table("uct", {
                            cols: [
                                { h: "ID", k: "id", f: (r) => lk("compliance", r.id) },
                                { h: "Milestone", k: "title", wrap: true },
                                {
                                    h: "Due",
                                    k: "due",
                                    f: (r) => `<span class="${r.overdue ? "bad b" : ""}">${fd(r.due)}</span>`,
                                },
                                {
                                    h: "Stage",
                                    k: "stage",
                                    f: (r) =>
                                        `<span class="pill ${r.stage === 4 ? "good" : r.stage >= 2 ? "acc" : r.overdue ? "bad" : "warn"}">${stageName(r)}</span>`,
                                },
                                {
                                    h: "Readiness",
                                    k: "ready",
                                    cls: "r",
                                    f: (r) =>
                                        `<div class="row" style="flex-wrap:nowrap"><div class="bar ${r.ready >= 80 ? "good" : r.ready >= 50 ? "warn" : "bad"}" style="width:54px"><i style="width:${r.ready}%"></i></div>${r.ready}%</div>`,
                                },
                                { h: "Owner", k: "owner" },
                                { h: "Evidence", k: "ref", f: (r) => `<span class="mono">${r.ref}</span>` },
                                { h: "Approval", k: "approval", wrap: true },
                                {
                                    h: "Discrepancies",
                                    k: "disc",
                                    cls: "r",
                                    f: (r) => (r.disc ? `<b class="${r.disc > 5 ? "bad" : "warn"}">${r.disc}</b>` : 0),
                                },
                                {
                                    h: "Escalation",
                                    k: "esc",
                                    f: (r) =>
                                        r.esc
                                            ? `<span class="pill ${r.esc >= 2 ? "bad" : "warn"}">L${r.esc}</span>`
                                            : "—",
                                    v: (r) => r.esc,
                                },
                            ],
                            rows: L,
                            open: (r) => ["compliance", r.id],
                            csv: "compliance",
                            pageSize: 12,
                            sort: 2,
                            dir: "asc",
                            filters: [
                                { k: "cat", label: "Category", get: (r) => r.cat },
                                { k: "st", label: "Stage", get: (r) => UST[r.stage] },
                                { k: "sem", label: "Semester", get: (r) => "Sem " + r.sem },
                            ],
                            search: (r) => [r.id, r.title, r.owner, r.ref, r.approval].join(" "),
                        }),
                        { sub: "Click a milestone to update readiness, record submission, escalate or attach evidence" }
                    );
                else if (cur === "calendar") {
                    const weeks = {};
                    L.filter((u) => u.due >= DEMO - 14 && u.due <= DEMO + 42).forEach((u) => {
                        const w = mondayOf(u.due);
                        (weeks[w] = weeks[w] || []).push(u);
                    });
                    body = card(
                        "Compliance calendar",
                        Object.keys(weeks)
                            .sort((a, b) => a - b)
                            .map(

                const metrics = metricRow([

                }
                return (

            /* ---------- 16 Action & Audit Center ---------- */
            const actClosed = (a) => a.status === "Verified & closed";
            const actOver = (a) => !actClosed(a) && a.status !== "Done – awaiting verification" && a.due < DEMO;
            V.actions = () => {

                    overdue: A.filter(actOver),

                    week: A.filter((a) => a.due >= DEMO && a.due <= DEMO + 6 && !actClosed(a)),
                    verify: A.filter((a) => a.status === "Done – awaiting verification"),

                        ["closure", "Closure rate"],

                    "all"
                );
                const tabNames = {
                    all: "all",
                    mine: "mine",
                    overdue: "overdue",
                    critical: "critical",
                    today: "today",
                    week: "week",
                    verify: "verify",
                    reopened: "reopened",
                };
                const open = A.filter((a) => !actClosed(a));
                const metrics = metricRow([
                    {
                        label: "Open actions",
                        v: open.length,
                        sub: `${A.length} in the register`,
                        act: "acttab",
                        arg: "all",
                    },
                    {
                        label: "Overdue",
                        v: sets.overdue.length,
                        tone: sets.overdue.length ? "bad" : "good",
                        act: "acttab",
                        arg: "overdue",
                    },
                    {
                        label: "Critical escalations",
                        v: sets.critical.length,
                        tone: sets.critical.length ? "bad" : "good",
                        act: "acttab",
                        arg: "critical",
                    },
                    { label: "Due this week", v: sets.week.length, tone: "warn", act: "acttab", arg: "week" },
                    {
                        label: "Awaiting verification",
                        v: sets.verify.length,
                        tone: sets.verify.length ? "warn" : "good",
                        act: "acttab",
                        arg: "verify",
                    },
                    {
                        label: "Closure rate",
                        v: pct(A.length ? (A.filter(actClosed).length / A.length) * 100 : null, 0),

                    },
                ]);
                let body = "";
                if (tabNames[cur]) {

                                    f: (r) =>
