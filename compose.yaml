services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: polaris_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set a strong owner password}
      POSTGRES_DB: polaris_mis
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris_owner -d polaris_mis"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://polaris_api:${POSTGRES_API_PASSWORD:?Set a URL-safe API password}@db:5432/polaris_mis
      JWT_SECRET: ${JWT_SECRET:?Set at least 32 random characters}
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact HTTPS application origin as a JSON array}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pg_data:
